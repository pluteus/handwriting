<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>走り書きメモ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            background: #ffffff;
            color: #333333;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* === ツールバー === */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f0f0f0;
            border-bottom: 1px solid #cccccc;
            flex-shrink: 0;
            z-index: 100;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: #333333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
        }

        .toolbar-btn:active {
            background: #e94560;
        }

        .toolbar-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* === 設定画面 === */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-label {
            font-size: 14px;
        }

        .settings-input {
            width: 60px;
            padding: 6px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        .settings-unit {
            font-size: 12px;
            color: #888;
            margin-left: 4px;
        }

        .settings-toggle {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .settings-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 28px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        .settings-toggle input:checked + .toggle-slider {
            background-color: #e94560;
        }

        .settings-toggle input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        .settings-close {
            width: 100%;
            padding: 10px;
            background: #333333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .settings-close:active {
            background: #e94560;
        }

        /* === フルスクリーン === */
        body.fullscreen .toolbar {
            display: none;
        }

        body.fullscreen .display-area {
            padding: 10px;
        }

        body.fullscreen .guide-text {
            display: none;
        }

        .exit-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        body.fullscreen .exit-fullscreen {
            display: flex;
        }

        /* === 表示エリア === */
        .display-area {
            background: #ffffff;
            padding: 20px;
            overflow: auto;
            position: relative;
            padding-bottom: 60px;
            -webkit-overflow-scrolling: touch;
            height: 50vh; /* 初期高さ */
            min-height: 100px;
        }

        /* === 境界線（リサイザー） === */
        .resizer {
            height: 8px;
            background: #cccccc;
            cursor: ns-resize;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .resizer::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 4px;
            border-top: 1px solid #666;
            border-bottom: 1px solid #666;
        }

        .zoom-container {
            transform-origin: top left;
            display: inline-block;
            min-width: 100%;
        }

        .char-item.selected,
        .space-char.selected {
            background: rgba(233, 69, 96, 0.3);
            border-radius: 2px;
        }

        .char-item {
            display: inline-block;
            height: 32px;
            margin: 0;
            vertical-align: top;
            position: relative;
        }

        .char-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        .space-char {
            display: inline-block;
            width: 16px;
            height: 32px;
            margin: 0;
            vertical-align: top;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 32px;
            background: #e94560;
            animation: blink 1s infinite;
            vertical-align: top;
            margin: 0 1px;
        }
        .cursor.hidden {
            display: none;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .line {
            border-bottom: 1px solid #eeeeee;
            min-height: 40px;
            min-width: 100%;
            padding: 4px 0;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            overflow: visible;
            position: relative;
            white-space: nowrap;
        }

        /* === 入力エリア === */
        .input-area {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 8px;
            flex-shrink: 0;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            flex: 1;
        }

        .canvas-wrapper {
            position: relative;
            flex-shrink: 0;
            width: var(--cv-w, 160px);
            height: var(--cv-h, 160px);
        }

        .canvas-wrapper.active {
            box-shadow: 0 0 0 3px #e94560;
            border-radius: 4px;
        }

        .canvas-wrapper.inactive {
            opacity: 0.5;
        }

        .canvas-wrapper canvas {
            background: #ffffff;
            border: 2px solid #999999;
            border-radius: 4px;
            cursor: crosshair;
            display: block;
            touch-action: none;
            width: var(--cv-w, 160px) !important;
            height: var(--cv-h, 160px) !important;
        }

        .canvas-label {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 10px;
            color: #888888;
            background: rgba(255,255,255,0.8);
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 10;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            width: 54px;
            height: 48px;
            background: #333333;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        .btn:active {
            background: #e94560;
        }

        .btn-backspace {
            font-size: 18px;
        }

        .guide-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888888;
            text-align: center;
            pointer-events: none;
        }

        body.fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #ffffff;
            z-index: 9999;
        }

        body.fullscreen .display-area {
            flex: 1;
            height: auto !important;
            padding: 10px;
        }
        body.fullscreen .resizer {
            display: none;
        }

        body.fullscreen .input-area {
            flex-shrink: 0;
        }
    </style>
</head>
