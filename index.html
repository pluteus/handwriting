                for (const line of lines) {
                    const r = line.getBoundingClientRect();
                    if (y >= r.top && y <= r.bottom) {
                        targetLine = line;
                        break;
                    }
                }
                
                if (targetLine && targetLine.querySelectorAll('.char-item, .space-char').length === 0) {
                    moveCursorToNearestPosition(targetLine, x);
                    return;
                }

                const els = Array.from(zoomContainer.querySelectorAll('.char-item, .space-char'));
                if (els.length === 0) {
                    if (lines.length > 0) moveCursorToNearestPosition(lines[0], x);
                    return;
                }
                
                let nearest = null, nearestDist = Infinity;
                for (const el of els) {
                    const r = el.getBoundingClientRect();
                    const cx = (r.left + r.right) / 2;
                    const cy = (r.top + r.bottom) / 2;
                    const dist = Math.abs(cx - x) + Math.abs(cy - y) * 2;
                    if (dist < nearestDist) { nearestDist = dist; nearest = el; }
                }
                if (!nearest) return;
                const r = nearest.getBoundingClientRect();
                const cx = (r.left + r.right) / 2;
                if (x < cx) {
                    nearest.parentNode.insertBefore(cursor, nearest);
                } else {
                    nearest.parentNode.insertBefore(cursor, nearest.nextSibling);
                }
                currentLine = cursor.parentNode;
                
                lines.forEach(l => l.id = '');
                currentLine.id = 'currentLine';
            }

            function forceEndMouseSelection() {
                cancelMouseLongPress();
                if (mode === 'mouse_selecting' || isMouseSelectionReady || selectStartEl) {
                    mode = 'idle';
                    isMouseSelectionReady = false;
                    selectStartEl = null;
                    selectEndEl = null;
                    return true; 
                }
                return false;
            }

            // === マウスの左ドラッグ範囲選択イベント ===
            displayArea.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;

                const startEl = charAtPoint(e.clientX, e.clientY);
                if (startEl) {
                    mouseStartX = e.clientX;
                    mouseStartY = e.clientY;
                    mouseDragged = false;
                    isMouseSelectionReady = false; 
                    selectStartEl = startEl;
                    selectEndEl = startEl;

                    cancelMouseLongPress();
                    mouseLongPressTimer = setTimeout(function() {
                        isMouseSelectionReady = true;
                        mode = 'mouse_selecting';
                        clearSelection();
                        selectStartEl.classList.add('selected');
                        cursor.classList.add('hidden');
                    }, LONG_PRESS_MS);
                }
            });

            window.addEventListener('mousemove', function(e) {
                if (!selectStartEl) return;

                const dx = e.clientX - mouseStartX;
                const dy = e.clientY - mouseStartY;
                const moveDistance = Math.sqrt(dx * dx + dy * dy);

                if (!isMouseSelectionReady && moveDistance > 8) {
                    cancelMouseLongPress();
                    isMouseSelectionReady = true;
                    mode = 'mouse_selecting';
                    clearSelection();
                    selectStartEl.classList.add('selected');
                    cursor.classList.add('hidden');
                }

                if (mode === 'mouse_selecting') {
                    mouseDragged = true; 
                    const el = charAtPoint(e.clientX, e.clientY);
                    if (el && el !== selectEndEl) {
                        selectEndEl = el;
                        updateSelection(selectStartEl, selectEndEl);
                    }
                    e.preventDefault();
                }
            }, { passive: false });

            window.addEventListener('mouseup', function(e) {
                if (e.button !== 0) return;
                
                const wasSelecting = forceEndMouseSelection();
                
                if (wasSelecting && mouseDragged) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }

                // 【修正箇所】単なる左クリック（ドラッグなし・長押しなし）でマウスが離された場合
                if (!mouseDragged && !wasSelecting && mouseStartX !== 0) {
                    if (charAtPoint(mouseStartX, mouseStartY) || e.target.closest('.line')) {
                        // 1. まず既存の選択（ハイライト）を完全に解除
                        clearSelection();
                        // 2. その後、クリックされた位置へ縦棒カーソルを移動
                        moveCursorToPoint(mouseStartX, mouseStartY);
                    }
                }

                mouseStartX = 0;
                mouseStartY = 0;
                mouseDragged = false;
            }, true); 

            displayArea.addEventListener('dragstart', function(e) {
                if (selectStartEl) {
                    e.preventDefault();
                }
            });

            window.addEventListener('blur', function() {
                forceEndMouseSelection();
                mouseDragged = false;
            });
            document.addEventListener('mouseleave', function() {
                forceEndMouseSelection();
                mouseDragged = false;
            });


            // === 背景クリック時の選択解除処理 ===
            displayArea.addEventListener('click', function(e) {
                if (mouseDragged) {
                    mouseDragged = false; 
                    e.stopPropagation();
                    e.preventDefault();
                    return;
                }

                const selected = document.querySelectorAll('.char-item.selected, .space-char.selected');
                if (selected.length > 0 && !e.target.closest('.char-item, .space-char')) {
                    clearSelection();
                    mode = 'idle';
                }
            }, true); 


            // === タッチイベント制御（既存処理の維持） ===
            displayArea.addEventListener('touchstart', function(e) {
                if (window._dividerDragging) return;

                if (e.touches.length === 1) {
                    const t = e.touches[0];

                    // === 左端余白タップ／スワイプによる行選択 ===
                    const daRectM = displayArea.getBoundingClientRect();
                    const zcRectM = zoomContainer.getBoundingClientRect();
                    if (t.clientX >= daRectM.left && t.clientX < zcRectM.left) {
                        cancelLongPress();
                        mode = 'margin_selecting';
                        marginStartLineIndex = lineIndexAtY(t.clientY);
                        marginEndLineIndex = marginStartLineIndex;
                        if (marginStartLineIndex >= 0) {
                            selectLines(marginStartLineIndex, marginStartLineIndex);
                        }
                        e.preventDefault();
                        return;
                    }

                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    
                    scrollStartX = t.clientX;
                    scrollStartY = t.clientY;
                    scrollOriginLeft = displayArea.scrollLeft;
                    scrollOriginTop  = displayArea.scrollTop;

                    mode = 'longpress_pending';
                    cancelLongPress();
                    
                    longPressTimer = setTimeout(function() {
                        mode = 'selecting';
                        selectStartEl = charAtPoint(touchStartX, touchStartY);
                        selectEndEl = selectStartEl;
                        clearSelection();
                        if (selectStartEl) selectStartEl.classList.add('selected');
                        cursor.classList.add('hidden');
                    }, LONG_PRESS_MS);

                } else if (e.touches.length === 2) {
                    cancelLongPress();
                    mode = 'pinching';
                    const dist = getTouchDist(e.touches);
                    pinchStartDist  = dist;
                    pinchStartScale = window._displayScale || currentScale;
                    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    scrollStartX = mx;
                    scrollStartY = my;
                    scrollOriginLeft = displayArea.scrollLeft;
                    scrollOriginTop  = displayArea.scrollTop;
                    clearSelection();
                }
                if (mode !== 'idle' && mode !== 'mouse_selecting') e.preventDefault();
            }, { passive: false });

            displayArea.addEventListener('touchmove', function(e) {
                if (window._dividerDragging) return;

                if (mode === 'margin_selecting') {
                    if (e.touches.length === 1) {
                        e.preventDefault();
                        const t = e.touches[0];
                        const newIdx = lineIndexAtY(t.clientY);
                        if (newIdx >= 0 && newIdx !== marginEndLineIndex) {
                            marginEndLineIndex = newIdx;
                            selectLines(marginStartLineIndex, marginEndLineIndex);
                        }
                    }
                    return;
                }

                if (mode === 'idle' || mode === 'mouse_selecting') return;
                e.preventDefault();

                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    const dx = t.clientX - touchStartX;
                    const dy = t.clientY - touchStartY;
                    const moved = Math.sqrt(dx*dx + dy*dy);

                    if (mode === 'longpress_pending') {
                        if (moved > 8) { 
                            cancelLongPress(); 
                            mode = 'scrolling_1finger'; 
                        }
                    }

                    if (mode === 'scrolling_1finger') {
                        const scrollDX = t.clientX - scrollStartX;
                        const scrollDY = t.clientY - scrollStartY;
                        displayArea.scrollLeft = scrollOriginLeft - scrollDX;
                        displayArea.scrollTop  = scrollOriginTop - scrollDY;
                    } else if (mode === 'selecting') {
                        const el = charAtPoint(t.clientX, t.clientY);
                        if (el && el !== selectEndEl) {
                            selectEndEl = el;
                            updateSelection(selectStartEl, selectEndEl);
                        }
                    }
                } else if (e.touches.length === 2) {
                    const dist = getTouchDist(e.touches);
                    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const pinchRatio = dist / pinchStartDist;
                    const scrollDX   = mx - scrollStartX;
                    const scrollDY   = my - scrollStartY;

                    let newScale = pinchStartScale * pinchRatio;
                    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
                    currentScale = newScale;
                    window._displayScale = currentScale;
                    zoomContainer.style.transform = 'scale(' + currentScale + ')';
                    // スライダーのズームラベルを更新
                    const zl = document.getElementById('dividerZoomLabel');
                    if (zl) zl.textContent = '×' + currentScale.toFixed(1);

                    displayArea.scrollLeft = scrollOriginLeft - scrollDX;
                    displayArea.scrollTop  = scrollOriginTop  - scrollDY;
                }
            }, { passive: false });

            displayArea.addEventListener('touchend', function(e) {
                if (window._dividerDragging) return;

                if (mode === 'margin_selecting') {
                    if (e.touches.length === 0) {
                        mode = 'idle';
                    }
                    return;
                }

                if (e.touches.length === 0) {
                    if (mode === 'longpress_pending') {
                        cancelLongPress();
                        moveCursorToPoint(touchStartX, touchStartY);
                        clearSelection();
                        cursor.classList.remove('hidden');
                    }
                    if (mode !== 'selecting') mode = 'idle';
                }
            }, { passive: true });
        })();
        // === ここから追加：キーボードイベント制御（コピペ対応版） ===
        (function() {
            // ヘルパー：選択ハイライトの更新（範囲指定）
            function updateSelectionRange(startEl, endEl) {
                document.querySelectorAll('.char-item.selected, .space-char.selected')
                    .forEach(el => el.classList.remove('selected'));
                if (!startEl || !endEl) return;
                const all = Array.from(zoomContainer.querySelectorAll('.char-item, .space-char'));
                const si = all.indexOf(startEl);
                const ei = all.indexOf(endEl);
                if (si < 0 || ei < 0) return;
                const lo = Math.min(si, ei), hi = Math.max(si, ei);
                for (let i = lo; i <= hi; i++) all[i].classList.add('selected');
                cursor.classList.add('hidden');
            }

            // ヘルパー：選択を完全に解除してカーソルを可視化する
            function clearSelectionOnly() {
                document.querySelectorAll('.char-item.selected, .space-char.selected')
                    .forEach(el => el.classList.remove('selected'));
                cursor.classList.remove('hidden');
                shiftAnchorX = null;
            }

            // Shift+上下選択時の基準X座標（始点文字のx中心）
            let shiftAnchorX = null;

            window.addEventListener('keydown', function(e) {
                // 入力フォーム等にフォーカスがある場合はスキップ（設定画面など）
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                    return;
                }

                const children = Array.from(currentLine.children);
                const cursorIndex = children.indexOf(cursor);
                const allLines = Array.from(document.querySelectorAll('.line'));
                const currentLineIndex = allLines.indexOf(currentLine);

                // 範囲選択用の基準要素
                let selectionActive = e.shiftKey;
                const selectedEls = Array.from(document.querySelectorAll('.char-item.selected, .space-char.selected'));

                // Ctrlキー（またはMacのCmdキー）との組み合わせ処理
                if (e.ctrlKey || e.metaKey) {
                    const key = e.key.toLowerCase();

                    // --- 元に戻す (Ctrl + Z) ---
                    if (key === 'z') {
                        e.preventDefault();
                        undo();
                        return;
                    }

                    // --- やり直し (Ctrl + Y) ---
                    if (key === 'y') {
                        e.preventDefault();
                        redo();
                        return;
                    }

                    // --- 全選択 (Ctrl + A) ---
                    if (key === 'a') {
                        e.preventDefault();
                        finalizeAll();
                        const all = Array.from(document.querySelectorAll('#zoomContainer .char-item, #zoomContainer .space-char'));
                        if (all.length > 0) {
                            all.forEach(el => el.classList.add('selected'));
                            cursor.classList.add('hidden');
                        }
                        return;
                    }

                    // --- コピー (Ctrl + C) ---
                    if (key === 'c') {
                        if (selectedEls.length > 0) {
                            e.preventDefault();
                            copySelectedToClipboard();
                        }
                        return;
                    }

                    // --- 切り取り (Ctrl + X) ---
                    if (key === 'x') {
                        if (selectedEls.length > 0) {
                            e.preventDefault();
                            copySelectedToClipboard();
                            getSelectedElements().forEach(el => el.remove());
                        }
                        return;
                    }

                    // --- 貼り付け (Ctrl + V) ---
                    if (key === 'v') {
                        if (internalClipboard.length > 0) {
                            e.preventDefault();
                            finalizeAll();

                            // 範囲選択があれば先に置き換え消去
                            if (selectedEls.length > 0) {
                                replaceSelectionWithCursor();
                            }

                            pasteFromClipboard();
                        }
                        return;
                    }
                }

                // 通常の1キー操作に対する確定処理
                const targetKeys = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Backspace', 'Delete', 'Enter', ' ', 'Tab', 'PageUp', 'PageDown'];
                if (targetKeys.includes(e.key)) {
                    finalizeAll();
                }

                switch (e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (selectionActive) {
                            if (cursorIndex > 0) {
                                const prevEl = children[cursorIndex - 1];
                                let startEl = selectedEls.length > 0 ? (selectedEls[0].classList.contains('select-start') ? selectedEls[0] : selectedEls[selectedEls.length - 1]) : prevEl;
                                if (selectedEls.length === 0) prevEl.classList.add('select-start');
                                currentLine.insertBefore(cursor, prevEl);
                                updateSelectionRange(startEl, prevEl);
                            } else if (currentLineIndex > 0) {
                                const prevLine = allLines[currentLineIndex - 1];
                                prevLine.appendChild(cursor);
                                currentLine.id = '';
                                prevLine.id = 'currentLine';
                                currentLine = prevLine;
                            }
                        } else {
                            if (selectedEls.length > 0) {
                                const targetLine = selectedEls[0].parentNode;
                                targetLine.insertBefore(cursor, selectedEls[0]);
                                currentLine.id = '';
                                targetLine.id = 'currentLine';
                                currentLine = targetLine;
                                clearSelectionOnly();
                            } else if (cursorIndex > 0) {
                                currentLine.insertBefore(cursor, children[cursorIndex - 1]);
                            } else if (currentLineIndex > 0) {
                                const prevLine = allLines[currentLineIndex - 1];
                                prevLine.appendChild(cursor);
                                currentLine.id = '';
                                prevLine.id = 'currentLine';
                                currentLine = prevLine;
                            }
                        }
                        scrollCursorIntoView();
                        break;

                    case 'ArrowRight':
                        e.preventDefault();
                        if (selectionActive) {
                            if (cursorIndex < children.length - 1) {
                                const nextEl = children[cursorIndex + 1];
                                let startEl = selectedEls.length > 0 ? (selectedEls[0].classList.contains('select-start') ? selectedEls[0] : selectedEls[0]) : nextEl;
                                if (selectedEls.length === 0) nextEl.classList.add('select-start');
                                currentLine.insertBefore(cursor, nextEl.nextSibling);
                                updateSelectionRange(startEl, nextEl);
                            } else if (currentLineIndex < allLines.length - 1) {
                                const nextLine = allLines[currentLineIndex + 1];
                                nextLine.insertBefore(cursor, nextLine.firstChild);
                                currentLine.id = '';
                                nextLine.id = 'currentLine';
                                currentLine = nextLine;
                            }
                        } else {
                            if (selectedEls.length > 0) {
                                const lastSelected = selectedEls[selectedEls.length - 1];
                                const targetLine = lastSelected.parentNode;
                                targetLine.insertBefore(cursor, lastSelected.nextSibling);
                                currentLine.id = '';
                                targetLine.id = 'currentLine';
                                currentLine = targetLine;
                                clearSelectionOnly();
                            } else if (cursorIndex < children.length - 1) {
                                currentLine.insertBefore(cursor, children[cursorIndex + 1].nextSibling);
                            } else if (currentLineIndex < allLines.length - 1) {
                                const nextLine = allLines[currentLineIndex + 1];
                                nextLine.insertBefore(cursor, nextLine.firstChild);
                                currentLine.id = '';
                                nextLine.id = 'currentLine';
                                currentLine = nextLine;
                            }
                        }
                        scrollCursorIntoView();
                        break;

                    case 'ArrowUp':
                        e.preventDefault();
                        if (selectionActive) {
                            // 始点要素を特定（まだ選択がなければカーソル直前の文字）
                            let anchorEl = selectedEls.find(el => el.classList.contains('select-start'));
                            if (!anchorEl) {
                                anchorEl = children[cursorIndex - 1] || children[0];
                            }
                            if (!anchorEl) break;
                            // 基準X: 始点要素のx中心（初回確定、以降変わらない）
                            if (shiftAnchorX === null) {
                                const r = anchorEl.getBoundingClientRect();
                                shiftAnchorX = (r.left + r.right) / 2;
                            }
                            // 全要素リストでの始点インデックス
                            const allCharsUp = Array.from(zoomContainer.querySelectorAll('.char-item, .space-char'));
                            const anchorIdx = allCharsUp.indexOf(anchorEl);
                            // 現在の終点行を求める:
                            //   上方向選択中は selectedEls[0] が終点（anchorより上にある）
                            //   まだ選択がなければ anchorEl の行が終点行
                            let endLineIndexUp;
                            if (selectedEls.length > 0) {
                                const firstIdx = allCharsUp.indexOf(selectedEls[0]);
                                if (firstIdx < anchorIdx) {
                                    // 上方向に選択済み → 先頭要素が終点
                                    endLineIndexUp = allLines.indexOf(selectedEls[0].parentNode);
                                } else {
                                    // 下方向or同行に選択済み → 末尾要素が終点
                                    endLineIndexUp = allLines.indexOf(selectedEls[selectedEls.length - 1].parentNode);
                                }
                            } else {
                                endLineIndexUp = allLines.indexOf(anchorEl.parentNode);
                            }
                            if (endLineIndexUp <= 0) break;
                            // 終点行の1つ上の行から基準Xに最も近い文字を終点に
                            const targetLine = allLines[endLineIndexUp - 1];
                            const targetChars = Array.from(targetLine.querySelectorAll('.char-item, .space-char'));
                            if (targetChars.length === 0) break;
                            const target = targetChars.reduce((best, el) => {
                                const cx = (el.getBoundingClientRect().left + el.getBoundingClientRect().right) / 2;
                                const bx = (best.getBoundingClientRect().left + best.getBoundingClientRect().right) / 2;
                                return Math.abs(cx - shiftAnchorX) < Math.abs(bx - shiftAnchorX) ? el : best;
                            });
                            if (!anchorEl.classList.contains('select-start')) anchorEl.classList.add('select-start');
                            updateSelectionRange(anchorEl, target);
                        } else if (currentLineIndex > 0) {
                            const prevLine = allLines[currentLineIndex - 1];
                            let baseLeft = cursor.getBoundingClientRect().left;
                            if (selectedEls.length > 0) {
                                baseLeft = selectedEls[0].getBoundingClientRect().left;
                            }
                            if (!selectionActive && selectedEls.length > 0) {
                                clearSelectionOnly();
                            }
                            moveCursorToNearestPosition(prevLine, baseLeft);
                        }
                        scrollCursorIntoView();
                        break;

                    case 'ArrowDown':
                        e.preventDefault();
                        if (selectionActive) {
                            // 始点要素を特定
                            let anchorEl = selectedEls.find(el => el.classList.contains('select-start'));
                            if (!anchorEl) {
                                anchorEl = children[cursorIndex - 1] || children[children.length - 2];
                            }
                            if (!anchorEl) break;
                            // 基準X: 始点要素のx中心
                            if (shiftAnchorX === null) {
                                const r = anchorEl.getBoundingClientRect();
                                shiftAnchorX = (r.left + r.right) / 2;
                            }
                            // 現在の終点行を求める（選択中の末尾要素の親行、または始点行）
                            const currentEndEl = selectedEls.length > 0
                                ? selectedEls[selectedEls.length - 1]
                                : anchorEl;
                            const endLine = currentEndEl.parentNode;
                            const endLineIndex = allLines.indexOf(endLine);
                            if (endLineIndex < 0 || endLineIndex >= allLines.length - 1) break;
                            // 終点行の1つ下の行の文字群から基準Xに最も近い文字を選ぶ
                            const targetLine = allLines[endLineIndex + 1];
                            const targetChars = Array.from(targetLine.querySelectorAll('.char-item, .space-char'));
                            if (targetChars.length === 0) break;
                            const target = targetChars.reduce((best, el) => {
                                const cx = (el.getBoundingClientRect().left + el.getBoundingClientRect().right) / 2;
                                const bx = (best.getBoundingClientRect().left + best.getBoundingClientRect().right) / 2;
                                return Math.abs(cx - shiftAnchorX) < Math.abs(bx - shiftAnchorX) ? el : best;
                            });
                            if (!anchorEl.classList.contains('select-start')) anchorEl.classList.add('select-start');
                            updateSelectionRange(anchorEl, target);
                        } else if (currentLineIndex < allLines.length - 1) {
                            const nextLine = allLines[currentLineIndex + 1];
                            let baseLeft = cursor.getBoundingClientRect().left;
                            if (selectedEls.length > 0) {
                                baseLeft = selectedEls[selectedEls.length - 1].getBoundingClientRect().right;
                            }
                            if (!selectionActive && selectedEls.length > 0) {
                                clearSelectionOnly();
                            }
                            moveCursorToNearestPosition(nextLine, baseLeft);
                        }
                        scrollCursorIntoView();
                        break;

                    case 'Backspace':
                        e.preventDefault();
                        if (selectedEls.length > 0) {
                            replaceSelectionWithCursor();
                        } else if (cursorIndex > 0) {
                            children[cursorIndex - 1].remove();
                        } else if (currentLineIndex > 0) {
                            const prevLine = allLines[currentLineIndex - 1];

                            const joinCursor = document.createElement('span');
                            joinCursor.className = 'cursor';
                            joinCursor.id = 'cursor';

                            prevLine.appendChild(joinCursor);

                            const elementsToMove = children.filter(el => el !== cursor);
                            elementsToMove.forEach(el => prevLine.insertBefore(el, joinCursor));

                            currentLine.remove();

                            cursor = joinCursor;
                            currentLine = prevLine;
                            currentLine.id = 'currentLine';
                            setupLineTapEvents();
                        }
                        scrollCursorIntoView();
                        break;

                    case 'Delete':
                        e.preventDefault();
                        if (selectedEls.length > 0) {
                            replaceSelectionWithCursor();
                        } else if (cursorIndex < children.length - 1) {
                            children[cursorIndex + 1].remove();
                        } else if (currentLineIndex < allLines.length - 1) {
                            const nextLine = allLines[currentLineIndex + 1];
                            const nextChildren = Array.from(nextLine.children).filter(el => el.id !== 'cursor');
                            nextChildren.forEach(el => currentLine.appendChild(el));
                            nextLine.remove();
                            setupLineTapEvents();
                        }
                        scrollCursorIntoView();
                        break;

                    case 'Enter':
                        e.preventDefault();
                        if (selectedEls.length > 0) replaceSelectionWithCursor();
                        document.getElementById('btnEnter').click();
                        break;

                    case ' ':
                        e.preventDefault();
                        if (selectedEls.length > 0) replaceSelectionWithCursor();
                        document.getElementById('btnSpace').click();
                        break;

                    case 'Tab':
                        e.preventDefault();
                        if (selectedEls.length > 0) replaceSelectionWithCursor();
                        for (let i = 0; i < 4; i++) {
                            const space = document.createElement('span');
                            space.className = 'space-char';
                            currentLine.insertBefore(space, cursor);
                        }
                        scrollCursorIntoView();
                        break;

                    case 'PageUp':
                        e.preventDefault();
                        displayArea.scrollTop -= displayArea.clientHeight * 0.8;
                        break;

                    case 'PageDown':
                        e.preventDefault();
                        displayArea.scrollTop += displayArea.clientHeight * 0.8;
                        break;
                }
            });
        })();
        // === ここまで追加：キーボードイベント制御（コピペ対応版） ===

        // ============================================================
        // 起動時: ローカル保存データを復元
        // ============================================================
        loadFromLocalStorage();
        // ============================================================

        // ============================================================
        // PWA対応: マニフェスト動的生成 ＋ Service Worker インライン登録
        // ============================================================
        // === Android 端端スワイプ（戻るジェスチャー）防止 ===
        (function() {
            const EDGE_WIDTH = 30; // px: 左端からこの幅以内のタッチを遮断
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 0 && e.touches[0].clientX < EDGE_WIDTH) {
                    e.preventDefault();
                }
            }, { passive: false });
        })();
        // === ここまで: スワイプ防止 ===

        (function() {

            // --- アイコン: 同フォルダの icon.svg を直接参照 ---
            const manifest = {
                name: 'マスガキ',
                short_name: 'masugaki',
                description: '手書き文字を並べて文章を作るアプリ',
                start_url: './',
                display: 'standalone',
                background_color: '#ffffff',
                theme_color: '#f0f0f0',
                orientation: 'any',
                icons: [
                    { src: 'icon.svg', sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }
                ]
            };

            const manifestJSON = JSON.stringify(manifest);
            const manifestDataURL = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestJSON);
            const link = document.createElement('link');
            link.rel  = 'manifest';
            link.href = manifestDataURL;
            document.head.appendChild(link);

            // Apple Touch Icon (ホーム画面アイコン用)
            const appleIcon = document.createElement('link');
            appleIcon.rel  = 'apple-touch-icon';
            appleIcon.href = 'icon.svg';
            document.head.appendChild(appleIcon);

            // --- Service Worker を外部ファイル sw.js として登録 ---
            // data:/Blob URI 方式はブラウザのセキュリティポリシーで拒否されるため、
            // index.html と同じディレクトリに置いた sw.js を登録する。
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(function(reg) {
                        console.log('[SW] 登録成功:', reg.scope);
                        reg.addEventListener('updatefound', function() {
                            const newWorker = reg.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', function() {
                                    if (newWorker.state === 'activated') {
                                        console.log('[SW] 新バージョンのキャッシュ完了');
                                    }
                                });
                            }
                        });
                    })
                    .catch(function(err) {
                        console.warn('[SW] 登録失敗:', err);
                    });
            }
        })();

            // Shiftキーが離れたら基準Xをリセット
            window.addEventListener('keyup', function(e) {
                if (e.key === 'Shift') {
                    shiftAnchorX = null;
                }
            });
        // ============================================================
        // PWA 対応 ここまで
        // ============================================================
    </script>
</body>
</html>
