<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f0f0f0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="マスガキ">
    <title>マスガキ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            background: #ffffff;
            color: #333333;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* === ツールバー === */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f0f0f0;
            border-bottom: 1px solid #cccccc;
            flex-shrink: 0;
            z-index: 100;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .toolbar::-webkit-scrollbar {
            display: none;
        }
.toolbar-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    font-size: 20px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: #333333;
}
        .toolbar-btn:active {
            background: #e94560;
        }

        .toolbar-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            display: none;
        }

        /* === 設定画面 === */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-label {
            font-size: 8px;
        }

        .settings-input {
            width: 60px;
            padding: 6px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        .settings-unit {
            font-size: 12px;
            color: #888;
            margin-left: 4px;
        }

        .settings-toggle {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .settings-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 28px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        .settings-toggle input:checked + .toggle-slider {
            background-color: #e94560;
        }

        .settings-toggle input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        .settings-close {
            width: 100%;
            padding: 10px;
            background: #333333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .settings-close:active {
            background: #e94560;
        }

        /* === フルスクリーン === */
        body.fullscreen .toolbar {
            display: none;
        }

        body.fullscreen .display-area {
            padding: 10px;
        }

        body.fullscreen .guide-text {
            display: none;
        }

        .exit-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        body.fullscreen .exit-fullscreen {
            display: flex;
        }

        /* === 表示エリア === */
        .display-area {
            background: #ffffff;
            padding: 20px;
            overflow: auto;
            position: relative;
            padding-bottom: 60px;
            -webkit-overflow-scrolling: touch;
            touch-action: none;
        }

        .zoom-container {
            transform-origin: top left;
            display: inline-block;
            min-width: 100%;
        }

        .char-item.selected,
        .space-char.selected {
            background: rgba(233, 69, 96, 0.3);
            border-radius: 2px;
        }

        .char-item {
            display: inline-block;
            height: 32px;
            margin: 0;
            vertical-align: top;
            position: relative;
        }

        .char-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        .space-char {
            display: inline-block;
            width: 16px;
            height: 32px;
            margin: 0;
            vertical-align: top;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 32px;
            background: #e94560;
            animation: blink 1s infinite;
            vertical-align: top;
            margin: 0 1px;
        }
        .cursor.hidden {
            display: none;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .line {
            border-bottom: 1px solid #eeeeee;
            min-height: 40px;
            min-width: 100%; /* 横幅いっぱいに広げてタップしやすく */
            padding: 4px 0;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            overflow: visible;
            position: relative;
            white-space: nowrap;
        }

        /* === 入力エリア === */
        .input-area {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 8px;
            flex-shrink: 0;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            flex: 1;
        }

        .canvas-wrapper {
            position: relative;
            flex: 1 1 0;
            min-width: 40px;
            height: var(--cv-h, 160px);
        }

        .canvas-wrapper.active {
            box-shadow: 0 0 0 3px #e94560;
            border-radius: 4px;
        }

        .canvas-wrapper.inactive {
            opacity: 0.5;
        }

        .canvas-wrapper canvas {
            background: #ffffff;
            border: 2px solid #999999;
            border-radius: 4px;
            cursor: crosshair;
            display: block;
            touch-action: none;
            width: 100% !important;
            height: 100% !important;
        }

        .canvas-label {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 10px;
            color: #888888;
            background: rgba(255,255,255,0.8);
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 10;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
    width: var(--btn-size, 48px);
    height: var(--btn-size, 48px);
    font-size: calc(var(--btn-size, 48px) * 0.45);
            background: #333333;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        .btn:active {
            background: #e94560;
        }

        .btn-backspace {
            font-size: 18px;
        }

        .guide-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888888;
            text-align: center;
            pointer-events: none;
        }

        /* === 境界スライダー === */
        .divider-slider {
            width: 100%;
            height: 28px;
            background: #e8e8e8;
            border-top: 1px solid #cccccc;
            border-bottom: 1px solid #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            cursor: ns-resize;
            touch-action: none;
            user-select: none;
            z-index: 10;
        }

        .divider-slider::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 4px;
            background: #aaaaaa;
            border-radius: 2px;
            box-shadow: 0 -5px 0 #aaaaaa, 0 5px 0 #aaaaaa;
        }

        /* 左右ドラッグ中のビジュアルフィードバック */
        .divider-slider.lr-active {
            background: #ddeeff;
        }
        .divider-slider.ud-active {
            background: #ffeedd;
        }

        /* スライダー上のズームインジケーター */
        .divider-zoom-label {
            position: absolute;
            right: 12px;
            font-size: 10px;
            color: #888;
            pointer-events: none;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .divider-slider.lr-active .divider-zoom-label {
            opacity: 1;
        }

        body.fullscreen .divider-slider {
            /* フルスクリーン時も表示 */
        }

        body.fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }

        body.fullscreen .display-area {
            padding: 10px;
        }

        body.fullscreen .input-area {
            flex-shrink: 0;
        }

        /* === ダークテーマ === */
        body.dark-theme {
            background: #000000;
            color: #eeeeee;
        }

        body.dark-theme.fullscreen {
            background: #000000;
        }

        body.dark-theme .toolbar {
            background: #1a1a1a;
            border-bottom: 1px solid #333333;
            color: #eeeeee;
        }

        body.dark-theme .toolbar-btn {
            color: #eeeeee;
        }

        body.dark-theme .settings-panel {
            background: #1a1a1a;
            color: #eeeeee;
        }

        body.dark-theme .settings-input {
            background: #333333;
            border-color: #555555;
            color: #eeeeee;
        }

        body.dark-theme .settings-unit {
            color: #aaaaaa;
        }

        body.dark-theme .toggle-slider {
            background-color: #555555;
        }

        body.dark-theme .settings-close {
            background: #444444;
        }

        body.dark-theme .display-area {
            background: #000000;
        }

        body.dark-theme .line {
            border-bottom: 1px solid #2a2a2a;
        }

        body.dark-theme .input-area {
            background: #111111;
        }

        /* 手書きキャンバス: 白背景+黒文字を反転させ、黒背景+白文字に見せる */
        body.dark-theme .canvas-wrapper canvas {
            filter: invert(1);
            border-color: #555555;
        }

        body.dark-theme .canvas-label {
            background: rgba(0,0,0,0.6);
            color: #cccccc;
        }

        /* 確定済み文字（黒文字の透過PNG）も白反転させる */
        body.dark-theme .char-item img {
            filter: invert(1);
        }

        body.dark-theme .guide-text {
            color: #777777;
        }

        body.dark-theme .btn {
            background: #333333;
            color: #eeeeee;
        }

        body.dark-theme .divider-slider {
            background: #1a1a1a;
            border-top: 1px solid #333333;
            border-bottom: 1px solid #333333;
        }

        body.dark-theme .divider-slider::before {
            background: #666666;
            box-shadow: 0 -5px 0 #666666, 0 5px 0 #666666;
        }
    </style>
</head>
<body>
    <div class="toolbar" id="toolbar">
<button class="toolbar-btn" id="btnShareKeep">📤</button>
<button class="toolbar-btn" id="btnSaveImage">💾</button>

<button class="toolbar-btn" id="btnCopy">📋</button>

<button class="toolbar-btn" id="btnPaste">📥</button>

    <div class="display-area" id="displayArea">

    <div class="divider-slider" id="dividerSlider">
        <span class="divider-zoom-label" id="dividerZoomLabel">×1.0</span>

    <div class="input-area">

        </div>

        <div class="buttons">
<button class="btn" id="btnBackspace">⌫</button>
<button class="btn" id="btnSpace">␣</button>
<button class="btn" id="btnEnter">↲</button>
        </div>

    <div class="guide-text">
        一方に書き、もう一方に書くと確定 / <span id="autoTimeDisplay">1</span>秒で自動確定
    </div>

    <script>
let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 100;

        const canvas1 = document.getElementById('canvas1');
        const canvas2 = document.getElementById('canvas2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');
        const wrapper1 = document.getElementById('wrapper1');
        const wrapper2 = document.getElementById('wrapper2');
        const displayArea = document.getElementById('displayArea');

        let currentLine = document.getElementById('currentLine');
        let cursor = document.getElementById('cursor');

        let hasDrawing1 = false;
        let hasDrawing2 = false;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentCanvas = null;
        let currentCtx = null;
        let autoFinalizeTimer = null;
        let AUTO_FINALIZE_DELAY = 1000;
        let PROP_MARGIN = 1;
        let CHAR_RESOLUTION = 64;
        let ENABLE_TOMEHANE = true; // とめ・はね・はらいを反映させるか
        let BASE_BRUSH_WIDTH = 8; // 基本筆太さ（320px canvas基準）

        // === 筆文字ストローク管理 ===
        // 各ストローク: { points: [{x,y,pressure,time}], ...}
        let strokes1 = []; // canvas1のストローク履歴
        let strokes2 = []; // canvas2のストローク履歴
        let currentStroke = null; // 現在書き中のストローク
        let currentStrokes = null; // 現在のキャンバスのストローク配列

        // ctxは直接使わずに、全描画はredrawCanvas()で行うため初期設定のみ
        ctx1.lineCap = 'round';
        ctx1.lineJoin = 'round';
        ctx2.lineCap = 'round';
        ctx2.lineJoin = 'round';

// ============================================================
// カーソルを表示エリア内に収めるスクロール
// ============================================================
function scrollCursorIntoView() {
    // DOM更新後に測定するため1フレーム待つ
    requestAnimationFrame(function() {
        const cur = document.getElementById('cursor');
        if (!cur) return;

        const areaRect = displayArea.getBoundingClientRect();
        const curRect  = cur.getBoundingClientRect();
        const margin   = 8; // px：端からの余白

        // 縦：上にはみ出ている
        if (curRect.top < areaRect.top) {
            displayArea.scrollTop -= (areaRect.top - curRect.top) + margin;
        }
        // 縦：下にはみ出ている
        else if (curRect.bottom > areaRect.bottom) {
            displayArea.scrollTop += (curRect.bottom - areaRect.bottom) + margin;
        }

        // 横：左にはみ出ている
        if (curRect.left < areaRect.left) {
            displayArea.scrollLeft -= (areaRect.left - curRect.left) + margin;
        }
        // 横：右にはみ出ている
        else if (curRect.right > areaRect.right) {
            displayArea.scrollLeft += (curRect.right - areaRect.right) + margin;
        }
    });
}
// ============================================================

// ============================================================
// ローカル保存 / 復元
// ============================================================
const LS_KEY = 'masugaki-content';

function saveToLocalStorage() {
    try {
        const zc = document.getElementById('zoomContainer');
        if (zc) localStorage.setItem(LS_KEY, zc.innerHTML);
    } catch (e) {
        // ストレージ容量超過などは無視
        console.warn('[保存] localStorage への保存に失敗:', e);
    }
}

function loadFromLocalStorage() {
    try {
        const saved = localStorage.getItem(LS_KEY);
        if (!saved) return;

        const zc = document.getElementById('zoomContainer');
        if (!zc) return;
        zc.innerHTML = saved;
        rebuildReferences();

        // カーソルが復元されなかった場合は末尾行に追加
        if (!document.getElementById('cursor')) {
            const allLines = document.querySelectorAll('.line');
            const lastLine = allLines[allLines.length - 1] || zc.querySelector('.line');
            if (lastLine) {
                const cur = document.createElement('span');
                cur.className = 'cursor';
                cur.id = 'cursor';
                lastLine.appendChild(cur);
                lastLine.id = 'currentLine';
                cursor = cur;
                currentLine = lastLine;
                rebuildReferences();
            }
        }

        // 復元後に表示エリアを末尾にスクロール
        requestAnimationFrame(function() {
            displayArea.scrollTop = displayArea.scrollHeight;
        });
    } catch (e) {
        console.warn('[復元] localStorage からの読み込みに失敗:', e);
    }
}

// アプリ終了・バックグラウンド移行時に保存
window.addEventListener('beforeunload', saveToLocalStorage);
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') {
        saveToLocalStorage();
    }
});
// ============================================================

function saveHistory() {
    redoStack = [];
    const zc = document.getElementById('zoomContainer');

    undoStack.push({
        html: zc.innerHTML,
        currentLineIndex: Array.from(
            document.querySelectorAll('.line')
        ).indexOf(currentLine)
    });

    if (undoStack.length > MAX_HISTORY) {
        undoStack.shift();
    }

    // 変更のたびにローカル保存
    saveToLocalStorage();
}
function rebuildReferences() {
    const lines = document.querySelectorAll('.line');

    currentLine =
        document.getElementById('currentLine') ||
        lines[lines.length - 1];

    cursor = document.getElementById('cursor');

    setupLineTapEvents();
}
function restoreState(state) {
    const zc = document.getElementById('zoomContainer');
    zc.innerHTML = state.html;
    rebuildReferences();
}
function undo() {
    if (undoStack.length === 0) return;
    const zc = document.getElementById('zoomContainer');

    redoStack.push({
        html: zc.innerHTML
    });

    const state = undoStack.pop();
    restoreState(state);
}
function redo() {
    if (redoStack.length === 0) return;
    const zc = document.getElementById('zoomContainer');

    undoStack.push({
        html: zc.innerHTML
    });

    const state = redoStack.pop();
    restoreState(state);
}
        function getPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startAutoFinalizeTimer(canvasNum) {
            clearAutoFinalizeTimer();
            autoFinalizeTimer = setTimeout(function() {
                if (canvasNum === 1 && hasDrawing1) {
                    finalizeCharacter(1);
                } else if (canvasNum === 2 && hasDrawing2) {
                    finalizeCharacter(2);
                }
            }, AUTO_FINALIZE_DELAY);
        }

        function clearAutoFinalizeTimer() {
            if (autoFinalizeTimer) {
                clearTimeout(autoFinalizeTimer);
                autoFinalizeTimer = null;
            }
        }

        // === 筆文字描画エンジン ===

        /**
         * 単一ストロークを筆文字風に描画する
         * とめ: ストローク末尾で筆が止まるため、末尾を太くしっかり描く
         * はね: 末尾が次の画方向へ細くなって跳ねる（ストロークの向きで判定）
         * はらい: ストローク末尾に向かって徐々に細くなる
         */
        function drawBrushStroke(ctx, points) {
            if (points.length < 2) {
                if (points.length === 1) {
                    // 点打ち（とめ）
                    ctx.beginPath();
                    ctx.arc(points[0].x, points[0].y, BASE_BRUSH_WIDTH * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                }
                return;
            }

            const n = points.length;

            // ストローク全体の速度・方向を分析してとめ/はね/はらいを判定
            // 終端付近の速度（速い=はらい、遅い=とめ）
            const tailLen = Math.min(6, Math.floor(n * 0.3));
            let tailDist = 0;
            for (let i = n - tailLen; i < n - 1; i++) {
                const dx = points[i+1].x - points[i].x;
                const dy = points[i+1].y - points[i].y;
                tailDist += Math.sqrt(dx*dx + dy*dy);
            }
            const tailSpeed = tailDist / Math.max(tailLen, 1);

            // 終端方向ベクトル
            const lastP = points[n-1];
            const prevP = points[Math.max(0, n - Math.min(4, n))];
            const endDx = lastP.x - prevP.x;
            const endDy = lastP.y - prevP.y;
            const endLen = Math.sqrt(endDx*endDx + endDy*endDy);

            // はらい判定: 終端が速く、左斜め下 or 右斜め下に向かう
            const isHarai = ENABLE_TOMEHANE && tailSpeed > 8 && endLen > 5;
            // はね判定: 終端が遅めで、上方向や内側に折り返す傾向
            const endAngle = Math.atan2(endDy, endDx);
            const isHane = ENABLE_TOMEHANE && !isHarai && tailSpeed > 3 && endDy < -2; // 上向きで終わるとはね

            // ストロークを区間ごとに描画（太さを変化させる）
            ctx.save();
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';

            for (let i = 1; i < n; i++) {
                const p0 = points[i - 1];
                const p1 = points[i];

                // 進捗率（0=始点, 1=終点）
                const t = i / (n - 1);

                // 基本太さの計算
                // 始点: やや細め（筆が入るとき）→ 中盤: 最大太さ → 終点: 効果によって変化
                let widthFactor;
                if (t < 0.1) {
                    // 書き始め: 細→太（筆の入り）
                    widthFactor = 0.4 + t * 6;
                } else if (t < 0.75 || !ENABLE_TOMEHANE) {
                    // 中間: 最大太さ（微妙に変化）
                    // とめ・はね・はらいを反映しない場合はここで太さを固定
                    widthFactor = 1.0;
                } else {
                    // 終端処理
                    const tailT = (t - 0.75) / 0.25; // 0→1

                    if (isHarai) {
                        // はらい: 徐々に細くなってゼロへ
                        widthFactor = 1.0 - tailT * tailT;
                    } else if (isHane) {
                        // はね: 少し太くなってから急に細くなる（跳ねる感じ）
                        widthFactor = tailT < 0.4
                            ? 1.0 + tailT * 0.3
                            : 1.3 - (tailT - 0.4) * 2.2;
                        widthFactor = Math.max(0.05, widthFactor);
                    } else {
                        // とめ: 少し太くなってから止まる（筆を押し付ける感じ）
                        widthFactor = tailT < 0.5
                            ? 1.0 + tailT * 0.4
                            : 1.2 - tailT * 0.2;
                    }
                }

                const w = Math.max(1, BASE_BRUSH_WIDTH * widthFactor);

                // 線分の方向に垂直な方向を求めて、太い線分を塗りつぶし多角形で描画
                const dx = p1.x - p0.x;
                const dy = p1.y - p0.y;
                const len = Math.sqrt(dx*dx + dy*dy);
                if (len < 0.1) continue;

                // 前のwidthFactor
                let prevWidthFactor;
                if ((i-1) / (n-1) < 0.1) {
                    prevWidthFactor = 0.4 + ((i-1)/(n-1)) * 6;
                } else if ((i-1) / (n-1) < 0.75 || !ENABLE_TOMEHANE) {
                    prevWidthFactor = 1.0;
                } else {
                    const pt = ((i-1)/(n-1) - 0.75) / 0.25;
                    if (isHarai) {
                        prevWidthFactor = 1.0 - pt * pt;
                    } else if (isHane) {
                        prevWidthFactor = pt < 0.4 ? 1.0 + pt * 0.3 : 1.3 - (pt - 0.4) * 2.2;
                        prevWidthFactor = Math.max(0.05, prevWidthFactor);
                    } else {
                        prevWidthFactor = pt < 0.5 ? 1.0 + pt * 0.4 : 1.2 - pt * 0.2;
                    }
                }
                const w0 = Math.max(1, BASE_BRUSH_WIDTH * prevWidthFactor);

                // 法線方向
                const nx = -dy / len;
                const ny = dx / len;

                // 台形ポリゴンで描画
                ctx.beginPath();
                ctx.moveTo(p0.x + nx * w0 * 0.5, p0.y + ny * w0 * 0.5);
                ctx.lineTo(p1.x + nx * w * 0.5, p1.y + ny * w * 0.5);
                ctx.lineTo(p1.x - nx * w * 0.5, p1.y - ny * w * 0.5);
                ctx.lineTo(p0.x - nx * w0 * 0.5, p0.y - ny * w0 * 0.5);
                ctx.closePath();
                ctx.fill();

                // 丸い継ぎ目を追加（ポリゴン間のギャップを埋める）
                ctx.beginPath();
                ctx.arc(p1.x, p1.y, w * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // はねの場合：終端に小さな跳ねを追加
            if (isHane && n >= 3) {
                const tp = points[n-1];
                const pp = points[Math.max(0, n-3)];
                // はねる方向（ストロークの方向に対して内側斜め上）
                const hDx = tp.x - pp.x;
                const hDy = tp.y - pp.y;
                const hLen = Math.sqrt(hDx*hDx + hDy*hDy);
                if (hLen > 2) {
                    // 法線方向（内側）にはねを伸ばす
                    const haneLen = BASE_BRUSH_WIDTH * 0.8;
                    const haneDirX = -hDy / hLen * 0.6 + hDx / hLen * 0.4;
                    const haneDirY = hDx / hLen * 0.6 + hDy / hLen * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(tp.x, tp.y);
                    ctx.quadraticCurveTo(
                        tp.x + haneDirX * haneLen * 0.5,
                        tp.y + haneDirY * haneLen * 0.5 - haneLen * 0.3,
                        tp.x + haneDirX * haneLen,
                        tp.y + haneDirY * haneLen - haneLen * 0.5
                    );
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#000000';
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function redrawCanvas(canvas, ctx, strokes) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const stroke of strokes) {
                drawBrushStroke(ctx, stroke.points);
            }
        }

        function startDraw(canvas, ctx, e) {
            isDrawing = true;
            currentCanvas = canvas;
            currentCtx = ctx;
            const pos = getPos(canvas, e);
            lastX = pos.x;
            lastY = pos.y;

            // 新しいストローク開始
            currentStroke = { points: [{ x: pos.x, y: pos.y, time: Date.now() }] };
            if (canvas === canvas1) {
                currentStrokes = strokes1;
                hasDrawing1 = true;
            } else {
                currentStrokes = strokes2;
                hasDrawing2 = true;
            }

            if (canvas === canvas1 && hasDrawing2) {
                finalizeCharacter(2);
            } else if (canvas === canvas2 && hasDrawing1) {
                finalizeCharacter(1);
            }

            // 最初の点を描画
            redrawCanvas(canvas, ctx, currentStrokes);
            drawBrushStroke(ctx, currentStroke.points);

            startAutoFinalizeTimer(canvas === canvas1 ? 1 : 2);
            updateActiveState();
        }

        function doDraw(e) {
            if (!isDrawing || !currentCanvas || !currentCtx || !currentStroke) return;
            const pos = getPos(currentCanvas, e);

            // 点を追加（間引き: 最小距離3px以上）
            const last = currentStroke.points[currentStroke.points.length - 1];
            const dx = pos.x - last.x;
            const dy = pos.y - last.y;
            if (dx*dx + dy*dy > 9) {
                currentStroke.points.push({ x: pos.x, y: pos.y, time: Date.now() });
                // キャンバス全体を再描画
                redrawCanvas(currentCanvas, currentCtx, currentStrokes);
                drawBrushStroke(currentCtx, currentStroke.points);
            }

            lastX = pos.x;
            lastY = pos.y;

            if (currentCanvas === canvas1 && hasDrawing1) {
                startAutoFinalizeTimer(1);
            } else if (currentCanvas === canvas2 && hasDrawing2) {
                startAutoFinalizeTimer(2);
            }
        }

        function endDraw() {
            if (isDrawing && currentStroke && currentStrokes) {
                // ストロークを確定してストローク配列に追加
                if (currentStroke.points.length > 0) {
                    currentStrokes.push(currentStroke);
                    // 最終描画
                    redrawCanvas(currentCanvas, currentCtx, currentStrokes);
                }
            }
            isDrawing = false;
            currentCanvas = null;
            currentCtx = null;
            currentStroke = null;
            currentStrokes = null;
        }

        function finalizeCharacter(canvasNum) {
            saveHistory();
            clearAutoFinalizeTimer();

            const sourceCanvas = canvasNum === 1 ? canvas1 : canvas2;
            const sourceCtx = canvasNum === 1 ? ctx1 : ctx2;

            const trimmed = trimCanvas(sourceCanvas);
            if (!trimmed) {
                if (canvasNum === 1) hasDrawing1 = false;
                else hasDrawing2 = false;
                updateActiveState();
                return;
            }

            const srcW = sourceCanvas.width;
            const srcH = sourceCanvas.height;
            const charRes = CHAR_RESOLUTION;
            const displayH = 32;

            const srcPixels = sourceCtx.getImageData(0, 0, srcW, srcH);
            const sd = srcPixels.data;
            const ALPHA_THRESHOLD = 32;
            let srcMinX = srcW, srcMaxX = 0;
            for (let y = 0; y < srcH; y++) {
                for (let x = 0; x < srcW; x++) {
                    const alpha = sd[(y * srcW + x) * 4 + 3];
                    if (alpha > ALPHA_THRESHOLD) {
                        if (x < srcMinX) srcMinX = x;
                        if (x > srcMaxX) srcMaxX = x;
                    }
                }
            }

            if (srcMaxX === 0) {
                if (canvasNum === 1) hasDrawing1 = false;
                else hasDrawing2 = false;
                updateActiveState();
                return;
            }

            let finalCanvas;
            let finalImgW;
            let displayW;

            const displayScale = displayH / srcH;
            const srcMargin = Math.round(PROP_MARGIN / displayScale);

            const cropSrcX = Math.max(0, srcMinX - srcMargin);
            const cropSrcW = Math.min(srcW - cropSrcX, srcMaxX - srcMinX + 1 + srcMargin * 2);
            const cropSrcH = srcH;

            const scaleW = charRes / srcH;
            finalImgW = Math.max(1, Math.round(cropSrcW * scaleW));
            displayW  = Math.max(1, Math.round(cropSrcW * displayScale + PROP_MARGIN * 2));

            finalCanvas = document.createElement('canvas');
            finalCanvas.width = finalImgW;
            finalCanvas.height = charRes;
            const finalCtx = finalCanvas.getContext('2d');
            finalCtx.clearRect(0, 0, finalImgW, charRes);
            finalCtx.drawImage(
                sourceCanvas,
                cropSrcX, 0, cropSrcW, cropSrcH,
                0, 0, finalImgW, charRes
            );

            const imgData = finalCanvas.toDataURL('image/png');

            replaceSelectionWithCursor();

            const charDiv = document.createElement('span');
            charDiv.className = 'char-item';
            charDiv.style.width = displayW + 'px';
            charDiv.style.height = displayH + 'px';

            const img = document.createElement('img');
            img.src = imgData;
            img.alt = '手書き文字';
            charDiv.appendChild(img);

            currentLine.insertBefore(charDiv, cursor);

            sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);

            if (canvasNum === 1) {
                hasDrawing1 = false;
                strokes1 = [];
            } else {
                hasDrawing2 = false;
                strokes2 = [];
            }

            scrollCursorIntoView();
            updateActiveState();
        }

        function finalizeAll() {
            if (hasDrawing1) finalizeCharacter(1);
            if (hasDrawing2) finalizeCharacter(2);
        }

        function trimCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = pixels.data;

            let minX = canvas.width, minY = canvas.height;
            let maxX = 0, maxY = 0;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const alpha = data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 0) {
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }

            if (maxX === 0) return null;

            const margin = PROP_MARGIN;

            return {
                x: Math.max(0, minX - margin),
                y: Math.max(0, minY - margin),
                w: Math.min(canvas.width - minX + margin * 2, maxX - minX + margin * 2),
                h: Math.min(canvas.height - minY + margin * 2, maxY - minY + margin * 2)
            };
        }

        function updateActiveState() {
            if (hasDrawing1 && !hasDrawing2) {
                wrapper1.classList.add('active');
                wrapper1.classList.remove('inactive');
                wrapper2.classList.remove('active');
                wrapper2.classList.remove('inactive');
            } else if (!hasDrawing1 && hasDrawing2) {
                wrapper1.classList.remove('active');
                wrapper1.classList.remove('inactive');
                wrapper2.classList.add('active');
                wrapper2.classList.remove('inactive');
            } else if (hasDrawing1 && hasDrawing2) {
                wrapper1.classList.remove('active');
                wrapper2.classList.remove('active');
            } else {
                wrapper1.classList.add('active');
                wrapper1.classList.remove('inactive');
                wrapper2.classList.remove('active');
                wrapper2.classList.remove('inactive');
            }
        }

        function moveCursorToNearestPosition(lineElement, tapX) {
//          【最優先追加】カーソルが移動したときは、理由を問わず画面上のすべての範囲選択を強制解除する
            document.querySelectorAll('.char-item.selected, .space-char.selected').forEach(el => el.classList.remove('selected'));
            
            const oldCursor = document.querySelector('.cursor');
            if (oldCursor) oldCursor.remove();

            const newCursor = document.createElement('span');
            newCursor.className = 'cursor';
            newCursor.id = 'cursor';

            const children = Array.from(lineElement.children).filter(child => !child.classList.contains('cursor'));

            // 改行のみ（文字要素がゼロ）の空の行をタップした場合は無条件で行頭に配置
            if (children.length === 0) {
                lineElement.appendChild(newCursor);
            } else {
                let closestIndex = 0;
                let minDistance = Infinity;

                for (let i = 0; i <= children.length; i++) {
                    let refX;
                    if (i === 0) {
                        refX = children[0].getBoundingClientRect().left;
                    } else if (i === children.length) {
                        refX = children[children.length - 1].getBoundingClientRect().right;
                    } else {
                        const leftRect = children[i - 1].getBoundingClientRect();
                        const rightRect = children[i].getBoundingClientRect();
                        refX = (leftRect.right + rightRect.left) / 2;
                    }

                    const distance = Math.abs(tapX - refX);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestIndex = i;
                    }
                }

                if (closestIndex === 0) {
                    lineElement.insertBefore(newCursor, children[0]);
                } else if (closestIndex >= children.length) {
                    lineElement.appendChild(newCursor);
                } else {
                    lineElement.insertBefore(newCursor, children[closestIndex]);
                }
            }

            currentLine.id = '';
            lineElement.id = 'currentLine';
            currentLine = lineElement;
            cursor = newCursor;
        }

        function setupLineTapEvents() {
            const lines = document.querySelectorAll('.line');
            lines.forEach(line => {
                // すでにあるリスナとの重複登録を防ぐため、一度クリアして再設定するのが望ましいですが
                // ここではシンプルに上書き可能な形、または通常のclick登録としています
                line.onclick = function(e) {
                    // 子要素（文字など）ではなく行自体がクリックを拾えるようにする
                    const tapX = e.clientX;
                    moveCursorToNearestPosition(line, tapX);
                };
            });
        }

        setupLineTapEvents();

        // === Pointer Events ===
        if (window.PointerEvent) {
            canvas1.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                canvas1.setPointerCapture(e.pointerId);
                startDraw(canvas1, ctx1, e);
            });

            canvas2.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                canvas2.setPointerCapture(e.pointerId);
                startDraw(canvas2, ctx2, e);
            });

            canvas1.addEventListener('pointermove', function(e) {
                if (isDrawing && currentCanvas === canvas1) {
                    e.preventDefault();
                    doDraw(e);
                }
            });

            canvas2.addEventListener('pointermove', function(e) {
                if (isDrawing && currentCanvas === canvas2) {
                    e.preventDefault();
                    doDraw(e);
                }
            });

            canvas1.addEventListener('pointerup', function(e) {
                e.preventDefault();
                endDraw();
            });

            canvas2.addEventListener('pointerup', function(e) {
                e.preventDefault();
                endDraw();
            });

            canvas1.addEventListener('pointercancel', function(e) {
                e.preventDefault();
                endDraw();
            });

            canvas2.addEventListener('pointercancel', function(e) {
                e.preventDefault();
                endDraw();
            });
        } else {
            canvas1.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startDraw(canvas1, ctx1, e);
            }, {passive: false});

            canvas1.addEventListener('touchmove', function(e) {
                e.preventDefault();
                doDraw(e);
            }, {passive: false});

            canvas1.addEventListener('touchend', function(e) {
                e.preventDefault();
                endDraw();
            }, {passive: false});

            canvas1.addEventListener('touchcancel', function(e) {
                e.preventDefault();
                endDraw();
            }, {passive: false});

            canvas2.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startDraw(canvas2, ctx2, e);
            }, {passive: false});

            canvas2.addEventListener('touchmove', function(e) {
                e.preventDefault();
                doDraw(e);
            }, {passive: false});

            canvas2.addEventListener('touchend', function(e) {
                e.preventDefault();
                endDraw();
            }, {passive: false});

            canvas2.addEventListener('touchcancel', function(e) {
                e.preventDefault();
                endDraw();
            }, {passive: false});
        }

        // === マウスイベント ===
        canvas1.addEventListener('mousedown', function(e) {
            startDraw(canvas1, ctx1, e);
        });

        canvas2.addEventListener('mousedown', function(e) {
            startDraw(canvas2, ctx2, e);
        });

        window.addEventListener('mousemove', function(e) {
            doDraw(e);
        });

        window.addEventListener('mouseup', function(e) {
            endDraw();
        });

        // === ボタン ===
 
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);

        document.getElementById('btnBackspace').addEventListener('click', function() {
            saveHistory();
            finalizeAll();

            if (replaceSelectionFromSnapshot()) {
                return;
            }

            const event = new KeyboardEvent('keydown', {
                key: 'Backspace',
                bubbles: true,
                cancelable: true
            });

            window.dispatchEvent(event);
        });

        function replaceSelectionWithCursor() {
            const sel = getSelectedElements();
            if (sel.length === 0) return false;

            const firstSel = sel[0];
            const parentLine = firstSel.parentNode;

            parentLine.insertBefore(cursor, firstSel);
            currentLine = parentLine;

            sel.forEach(el => el.remove());

            cursor.classList.remove('hidden');
            return true;
        }

        let internalClipboard = [];

        let _selectionSnapshot = [];

        function saveSelectionSnapshot() {
            _selectionSnapshot = getSelectedElements().slice();
        }

        function restoreSelectionSnapshot() {
            if (_selectionSnapshot.length === 0) return false;
            let restored = false;
            _selectionSnapshot.forEach(el => {
                if (document.contains(el)) {
                    el.classList.add('selected');
                    restored = true;
                }
            });
            _selectionSnapshot = [];
            return restored;
        }

        function replaceSelectionFromSnapshot() {
            restoreSelectionSnapshot();
            return replaceSelectionWithCursor();
        }

        function prepareEditOperation() {
            finalizeAll();
            replaceSelectionFromSnapshot();
        }

        ['btnBackspace', 'btnSpace', 'btnEnter'].forEach(id => {
            document.getElementById(id).addEventListener('pointerdown', function() {
                saveSelectionSnapshot();
            });
        });


        function getSelectedElements() {
            const all = Array.from(document.querySelectorAll(
                '#zoomContainer .char-item, #zoomContainer .space-char'));
            return all.filter(el => el.classList.contains('selected'));
        }

        function cloneCharEl(el) {
            const span = document.createElement('span');
            span.className = el.className.replace(' selected', '');
            span.style.cssText = el.style.cssText;
            if (el.classList.contains('char-item')) {
                const img = document.createElement('img');
                img.src = el.querySelector('img').src;
                img.alt = '手書き文字';
                span.appendChild(img);
            }
            return span;
        }

        function copySelectedToClipboard() {
            const sel = getSelectedElements();
            if (sel.length === 0) return false;

            const allLines = Array.from(document.querySelectorAll('.line'));
            const groups = [];
            let currentGroup = [];
            let prevLineIndex = -1;

            for (const el of sel) {
                const lineIndex = allLines.indexOf(el.parentNode);

                if (prevLineIndex >= 0 && lineIndex !== prevLineIndex) {
                    groups.push(currentGroup);

                    for (let i = prevLineIndex + 1; i < lineIndex; i++) {
                        groups.push([]); // 空行保持
                    }

                    currentGroup = [];
                }

                currentGroup.push(cloneCharEl(el));
                prevLineIndex = lineIndex;
            }

            groups.push(currentGroup);
            internalClipboard = groups;
            return true;
        }

        function pasteFromClipboard() {
            if (internalClipboard.length === 0) return;

            for (let gi = 0; gi < internalClipboard.length; gi++) {
                const group = internalClipboard[gi];

                if (gi > 0) {
                    const cursorIndex = Array.from(currentLine.children).indexOf(cursor);
                    const allChildren = Array.from(currentLine.children);
                    const elementsToMove = [];
                    for (let i = cursorIndex + 1; i < allChildren.length; i++) {
                        elementsToMove.push(allChildren[i]);
                    }
                    const newLine = document.createElement('div');
                    newLine.className = 'line';
                    const newCursor = document.createElement('span');
                    newCursor.className = 'cursor';
                    newCursor.id = 'cursor';
                    newLine.appendChild(newCursor);

        // === ツールバー機能 ===
        function captureDisplayArea() {
            finalizeAll();

            const lines = document.querySelectorAll('.line');
            if (lines.length === 0) return null;

            const captureCanvas = document.createElement('canvas');
            const padding = 20;
            const lineHeight = 44;

            let maxWidth = 0;
            lines.forEach(line => {
                const chars = line.querySelectorAll('.char-item, .space-char');
                let width = padding * 2;
                chars.forEach(char => {
                    const rect = char.getBoundingClientRect();
                    width += rect.width + 4;
                });
                if (width > maxWidth) maxWidth = width;
            });

            captureCanvas.width = Math.max(maxWidth, 400);
            captureCanvas.height = lines.length * lineHeight + padding * 2;

            const cctx = captureCanvas.getContext('2d');
            cctx.fillStyle = '#ffffff';
            cctx.fillRect(0, 0, captureCanvas.width, captureCanvas.height);

            cctx.strokeStyle = '#eeeeee';
            cctx.lineWidth = 1;

            lines.forEach((line, lineIdx) => {
                const y = padding + lineIdx * lineHeight;
                cctx.beginPath();
                cctx.moveTo(0, y + lineHeight - 4);
                cctx.lineTo(captureCanvas.width, y + lineHeight - 4);
                cctx.stroke();

                let x = padding;
                const chars = line.querySelectorAll('.char-item, .space-char');
                chars.forEach((char) => {
                    if (char.classList.contains('space-char')) {
                        x += 16;
                    } else {
                        const img = char.querySelector('img');
                        if (img && img.complete) {
                            const w = parseInt(char.style.width) || 32;
                            cctx.drawImage(img, x, y, w, 32);
                            x += w + 4;
                        }
                    }
                });
            });

            return captureCanvas;
        }

        // === スライダーによる境界調整・入力エリアサイズ計算・ズーム操作 ===
        (function() {
            const displayArea = document.getElementById('displayArea');
            const inputArea   = document.querySelector('.input-area');
            const toolbar     = document.getElementById('toolbar');
            const slider      = document.getElementById('dividerSlider');
            const zoomLabel   = document.getElementById('dividerZoomLabel');

            // ---- ズーム状態（罫線エリアのscale）----
            // zoomContainerへの参照はこのIIFE内では取得できないため
            // 後段IIFEと共有するためwindow変数を使う
            window._displayScale = 1.0;
            const MIN_SCALE = 0.3;
            const MAX_SCALE = 4.0;

            function applyDisplayScale(scale) {
                window._displayScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
                const zc = document.getElementById('zoomContainer');
                if (zc) zc.style.transform = 'scale(' + window._displayScale.toFixed(2) + ')';
                zoomLabel.textContent = '×' + window._displayScale.toFixed(1);
            }

            // ---- 高さ計算 ----
            const MIN_INPUT_AREA_H = 40 + (10 * 2);
            const PADDING = 10 * 2;

            function calcDefaultDisplayHeight() {
                const appH = window.innerHeight;
                const appW = window.innerWidth;
                const toolbarH = toolbar ? toolbar.offsetHeight : 0;
                const sliderH  = slider  ? slider.offsetHeight  : 28;
                const btnSize  = parseFloat(
                    getComputedStyle(document.documentElement).getPropertyValue('--btn-size')
                ) || 48;
                const buttonsW      = btnSize + 20;
                const inputSquareSide = (appW - buttonsW) / 2;
                const borderY       = appH - inputSquareSide - sliderH;
                return Math.max(100, borderY - toolbarH);
            }

            let userMoved     = false;
            let displayHeight = calcDefaultDisplayHeight();
            displayArea.style.flex   = 'none';
            displayArea.style.height = displayHeight + 'px';

            // 他のtouchハンドラから参照できるよう公開
            window._dividerDragging = false;

            function checkLayout() {
                displayArea.style.flex   = 'none';
                displayArea.style.height = displayHeight + 'px';

                const totalH = inputArea.clientHeight;
                const finalH = Math.max(40, totalH - PADDING);
                inputArea.style.setProperty('--cv-h', finalH + 'px');

                requestAnimationFrame(() => {
                    ['wrapper1', 'wrapper2'].forEach(id => {
                        const wr = document.getElementById(id);
                        if (!wr) return;
                        const cv = wr.querySelector('canvas');
                        const w  = wr.clientWidth;
                        const h  = wr.clientHeight;
                        if (w > 0 && h > 0) {
                            cv.width  = w;
                            cv.height = h;
                            const ctx = cv.getContext('2d');
                            ctx.lineCap    = 'round';
                            ctx.lineJoin   = 'round';
                            ctx.lineWidth  = 6;
                            ctx.strokeStyle = '#000000';
                        }
                    });
                });

                const btnSize = Math.max(40, Math.floor(finalH / 4));
                inputArea.style.setProperty('--btn-size', btnSize + 'px');
            }

            // ---- スライダー操作 ----
            // 上下スワイプ → 手書きエリア高さ変更（displayAreaの高さを逆方向に変化）
            // 左右スワイプ → 罫線エリアのズーム
            let sliderDragging = false;
            let sliderStartX   = 0;
            let sliderStartY   = 0;
            let sliderStartH   = 0;
            let sliderStartScale = 1.0;
            let sliderDir      = null; // 'ud' | 'lr' | null

            const DIR_THRESHOLD = 6; // px: 方向決定の閾値

            function sliderPointerStart(e) {
                if (e.touches && e.touches.length !== 1) return;
                sliderDragging   = true;
                window._dividerDragging = true;
                sliderDir        = null;
                const pt         = e.touches ? e.touches[0] : e;
                sliderStartX     = pt.clientX;
                sliderStartY     = pt.clientY;
                sliderStartH     = displayHeight;
                sliderStartScale = window._displayScale;
                slider.classList.remove('ud-active', 'lr-active');
                e.preventDefault();
            }

            function sliderPointerMove(e) {
                if (!sliderDragging) return;
                const pt  = e.touches ? e.touches[0] : e;
                const dx  = pt.clientX - sliderStartX;
                const dy  = pt.clientY - sliderStartY;

                // 方向をまだ決めていない場合
                if (!sliderDir) {
                    if (Math.abs(dx) < DIR_THRESHOLD && Math.abs(dy) < DIR_THRESHOLD) {
                        e.preventDefault(); return;
                    }
                    sliderDir = Math.abs(dy) >= Math.abs(dx) ? 'ud' : 'lr';
                    slider.classList.toggle('ud-active', sliderDir === 'ud');
                    slider.classList.toggle('lr-active', sliderDir === 'lr');
                }

                if (sliderDir === 'ud') {
                    // 上スワイプ → 手書きエリア拡大（displayArea縮小）
                    const toolbarH = toolbar ? toolbar.offsetHeight : 0;
                    const sliderH  = slider  ? slider.offsetHeight  : 28;
                    const maxH = window.innerHeight - toolbarH - sliderH - MIN_INPUT_AREA_H;
                    // dy > 0 (下スワイプ) → displayArea大きく → 手書きエリア小さく
                    // dy < 0 (上スワイプ) → displayArea小さく → 手書きエリア大きく
                    let newH = sliderStartH + dy;
                    newH = Math.max(60, Math.min(maxH, newH));
                    userMoved     = true;
                    displayHeight = newH;
                    checkLayout();
                } else {
                    // 左右スワイプ → 罫線エリアズーム
                    // 右スワイプ → 拡大、左スワイプ → 縮小
                    const sensitivity = 0.005; // px あたりのscale変化量
                    const newScale = sliderStartScale + dx * sensitivity;
                    applyDisplayScale(newScale);
                }

                e.preventDefault();
            }

            function sliderPointerEnd(e) {
                if (!sliderDragging) return;
                sliderDragging = false;
                window._dividerDragging = false;
                slider.classList.remove('ud-active', 'lr-active');
                sliderDir = null;
            }

            // タッチ
            slider.addEventListener('touchstart',  sliderPointerStart, { passive: false });
            slider.addEventListener('touchmove',   sliderPointerMove,  { passive: false });
            slider.addEventListener('touchend',    sliderPointerEnd,   { passive: false });
            slider.addEventListener('touchcancel', sliderPointerEnd,   { passive: false });

            // マウス（PC）
            slider.addEventListener('mousedown', sliderPointerStart);
            window.addEventListener('mousemove', function(e) {
                if (sliderDragging) sliderPointerMove(e);
            });
            window.addEventListener('mouseup', function(e) {
                if (sliderDragging) sliderPointerEnd(e);

            const ro = new ResizeObserver(checkLayout);
            ro.observe(inputArea);

            window.addEventListener('resize', function() {

                    displayHeight = calcDefaultDisplayHeight();
                    displayArea.style.height = displayHeight + 'px';
                }
                checkLayout();
            });
            window.addEventListener('orientationchange', function() {
                userMoved = false;
                setTimeout(function() {

            // ---- フルスクリーン ----
            function recalcFullscreenHeight() {
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        const sliderH = slider ? slider.offsetHeight : 28;
                        const inputH  = document.querySelector('.input-area').offsetHeight;
                        displayHeight = window.innerHeight - inputH - sliderH;
                        userMoved     = false;
                        checkLayout();

            }

            document.getElementById('btnFullscreen').addEventListener('click', async function() {

            document.addEventListener('fullscreenchange', function() {

                } else {

                    userMoved = false;
                    checkLayout();
                }

        })();
        // === displayArea タッチ＆マウスドラッグ統合制御（クリック時選択解除対応版） ===
        (function() {
            const zoomContainer = document.getElementById('zoomContainer');
            let currentScale = 1.0;

            const MAX_SCALE = 4.0;

            let marginEndLineIndex   = -1;

            let mouseLongPressTimer = null;

            function getTouchDist(t) {
                const dx = t[0].clientX - t[1].clientX;
                const dy = t[0].clientY - t[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function charAtPoint(x, y) {
                const els = zoomContainer.querySelectorAll('.char-item, .space-char');
                for (const el of els) {
                    const r = el.getBoundingClientRect();
                    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return el;
                }
                return null;
            }

            // Y座標から対象行のインデックスを求める（範囲外の場合は最も近い行）
            function lineIndexAtY(y) {
                const lines = Array.from(zoomContainer.querySelectorAll('.line'));
                for (let i = 0; i < lines.length; i++) {
                    const r = lines[i].getBoundingClientRect();
                    if (y >= r.top && y <= r.bottom) return i;
                }
                let nearestIdx = -1, nearestDist = Infinity;
                lines.forEach((line, i) => {
                    const r = line.getBoundingClientRect();
                    const cy = (r.top + r.bottom) / 2;
                    const d = Math.abs(cy - y);
                    if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
                });
                return nearestIdx;
            }

            // 指定した行インデックス範囲（複数可）の文字を選択状態にする
            function selectLines(startIdx, endIdx) {
                document.querySelectorAll('.char-item.selected, .space-char.selected')
                    .forEach(el => el.classList.remove('selected'));
                if (startIdx < 0 || endIdx < 0) return;
                const lines = Array.from(zoomContainer.querySelectorAll('.line'));
                const lo = Math.min(startIdx, endIdx), hi = Math.max(startIdx, endIdx);
                for (let i = lo; i <= hi && i < lines.length; i++) {
                    lines[i].querySelectorAll('.char-item, .space-char').forEach(el => el.classList.add('selected'));
                }

                document.querySelectorAll('.char-item.selected, .space-char.selected')
                    .forEach(el => el.classList.remove('selected'));
                if (!startEl || !endEl) return;
                const all = Array.from(zoomContainer.querySelectorAll('.char-item, .space-char'));
                const si = all.indexOf(startEl);
                const ei = all.indexOf(endEl);
                if (si < 0 || ei < 0) return;
                const lo = Math.min(si, ei), hi = Math.max(si, ei);
                for (let i = lo; i <= hi; i++) all[i].classList.add('selected');
                cursor.classList.add('hidden');
            }

                document.querySelectorAll('.char-item.selected, .space-char.selected')

            function moveCursorToPoint(x, y) {
