<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>走り書きメモ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            background: #ffffff;
            color: #333333;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* === ツールバー === */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f0f0f0;
            border-bottom: 1px solid #cccccc;
            flex-shrink: 0;
            z-index: 100;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: #333333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
        }

        .toolbar-btn:active {
            background: #e94560;
        }

        .toolbar-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* === 設定画面 === */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings-label {
            font-size: 14px;
        }

        .settings-input {
            width: 60px;
            padding: 6px 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }

        .settings-unit {
            font-size: 12px;
            color: #888;
            margin-left: 4px;
        }

        .settings-toggle {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .settings-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 28px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        .settings-toggle input:checked + .toggle-slider {
            background-color: #e94560;
        }

        .settings-toggle input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }

        .settings-close {
            width: 100%;
            padding: 10px;
            background: #333333;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .settings-close:active {
            background: #e94560;
        }

        /* === フルスクリーン === */
        body.fullscreen .toolbar {
            display: none;
        }

        body.fullscreen .display-area {
            padding: 10px;
        }

        body.fullscreen .guide-text {
            display: none;
        }

        .exit-fullscreen {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        body.fullscreen .exit-fullscreen {
            display: flex;
        }

        /* === 表示エリア === */
        .display-area {
            background: #ffffff;
            border-bottom: 4px solid #cccccc;
            padding: 20px;
            overflow: auto;
            position: relative;
            padding-bottom: 60px;
            -webkit-overflow-scrolling: touch;
            touch-action: none;
            cursor: ns-resize;
        }

        .zoom-container {
            transform-origin: top left;
            display: inline-block;
            min-width: 100%;
        }

        .char-item.selected,
        .space-char.selected {
            background: rgba(233, 69, 96, 0.3);
            border-radius: 2px;
        }

        .char-item {
            display: inline-block;
            height: 32px;
            margin: 0;
            vertical-align: top;
            position: relative;
        }

        .char-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: auto;
        }

        .space-char {
            display: inline-block;
            width: 16px;
            height: 32px;
            margin: 0;
            vertical-align: top;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 32px;
            background: #e94560;
            animation: blink 1s infinite;
            vertical-align: top;
            margin: 0 1px;
        }
        .cursor.hidden {
            display: none;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .line {
            border-bottom: 1px solid #eeeeee;
            min-height: 40px;
            min-width: 100%; /* 横幅いっぱいに広げてタップしやすく */
            padding: 4px 0;
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            overflow: visible;
            position: relative;
            white-space: nowrap;
        }

        /* === 入力エリア === */
        .input-area {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 8px;
            flex-shrink: 0;
            box-sizing: border-box;
            overflow: hidden;
            width: 100%;
            flex: 1;
        }

        .canvas-wrapper {
            position: relative;
            flex-shrink: 0;
            width: var(--cv-w, 160px);
            height: var(--cv-h, 160px);
        }

        .canvas-wrapper.active {
            box-shadow: 0 0 0 3px #e94560;
            border-radius: 4px;
        }

        .canvas-wrapper.inactive {
            opacity: 0.5;
        }

        .canvas-wrapper canvas {
            background: #ffffff;
            border: 2px solid #999999;
            border-radius: 4px;
            cursor: crosshair;
            display: block;
            touch-action: none;
            width: var(--cv-w, 160px) !important;
            height: var(--cv-h, 160px) !important;
        }

        .canvas-label {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 10px;
            color: #888888;
            background: rgba(255,255,255,0.8);
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 10;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn {
            width: 54px;
            height: 48px;
            background: #333333;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        .btn:active {
            background: #e94560;
        }

        .btn-backspace {
            font-size: 18px;
        }

        .guide-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888888;
            text-align: center;
            pointer-events: none;
        }

        body.fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: #ffffff;
            z-index: 9999;
        }

        body.fullscreen .display-area {
            flex: 1;
            height: auto;
            padding: 10px;
        }

        body.fullscreen .input-area {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="toolbar" id="toolbar">
        <button class="toolbar-btn" id="btnShareKeep">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            <span>Keep共有</span>
        </button>
        <button class="toolbar-btn" id="btnSaveImage">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>

        </button>
        <button class="toolbar-btn" id="btnSettings">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span>設定</span>
        </button>
        <button class="toolbar-btn" id="btnFullscreen">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <span>最大化</span>
        </button>
    </div>

    <button class="exit-fullscreen" id="btnExitFullscreen">✕</button>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-title">設定</div>
            <div class="settings-row">
                <span class="settings-label">自動確定時間</span>
                <div>
                    <input type="number" class="settings-input" id="settingAutoTime" value="1" min="1" max="30">
                    <span class="settings-unit">秒</span>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-label">等幅フォント</span>
                <label class="settings-toggle">
                    <input type="checkbox" id="settingMonoWidth">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="settings-row">
                <span class="settings-label">プロポーショナル余白</span>
                <div>
                    <input type="number" class="settings-input" id="settingPropMargin" value="1" min="0" max="10">
                    <span class="settings-unit">px</span>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-label">文字解像度</span>
                <div>
                    <input type="number" class="settings-input" id="settingCharRes" value="64" min="32" max="256" step="32">
                    <span class="settings-unit">px</span>
                </div>
            </div>
            <button class="settings-close" id="btnCloseSettings">閉じる</button>
        </div>
    </div>

    <div class="display-area" id="displayArea">
        <div class="zoom-container" id="zoomContainer">
            <div class="line" id="currentLine">
                <span class="cursor" id="cursor"></span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="canvas-wrapper active" id="wrapper1">
            <span class="canvas-label">左</span>
            <canvas id="canvas1" width="320" height="320"></canvas>
        </div>

        <div class="canvas-wrapper" id="wrapper2">
            <span class="canvas-label">右</span>
            <canvas id="canvas2" width="320" height="320"></canvas>
        </div>

        <div class="buttons">
            <button class="btn btn-backspace" id="btnBackspace">⌫</button>
            <button class="btn btn-space" id="btnSpace">空白</button>
            <button class="btn btn-enter" id="btnEnter">改行</button>
        </div>
        <div class="buttons">
            <button class="btn" id="btnCopy">コピー</button>
            <button class="btn" id="btnCut">切取</button>
            <button class="btn" id="btnPaste">貼付</button>
        </div>
    </div>

    <div class="guide-text">
        一方に書き、もう一方に書くと確定 / <span id="autoTimeDisplay">1</span>秒で自動確定
    </div>

    <script>
        const canvas1 = document.getElementById('canvas1');
        const canvas2 = document.getElementById('canvas2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');
        const wrapper1 = document.getElementById('wrapper1');
        const wrapper2 = document.getElementById('wrapper2');
        const displayArea = document.getElementById('displayArea');

        let currentLine = document.getElementById('currentLine');
        let cursor = document.getElementById('cursor');

        let hasDrawing1 = false;
        let hasDrawing2 = false;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentCanvas = null;
        let currentCtx = null;
        let autoFinalizeTimer = null;
        let AUTO_FINALIZE_DELAY = 1000;
        let MONO_WIDTH = false;
        let PROP_MARGIN = 1;
        let CHAR_RESOLUTION = 64;

        ctx1.lineCap = 'round';
        ctx1.lineJoin = 'round';
        ctx1.lineWidth = 6;
        ctx1.strokeStyle = '#000000';

        ctx2.lineCap = 'round';
        ctx2.lineJoin = 'round';
        ctx2.lineWidth = 6;
        ctx2.strokeStyle = '#000000';

        function getPos(canvas, e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startAutoFinalizeTimer(canvasNum) {
            clearAutoFinalizeTimer();
            autoFinalizeTimer = setTimeout(function() {
                if (canvasNum === 1 && hasDrawing1) {
                    finalizeCharacter(1);
                } else if (canvasNum === 2 && hasDrawing2) {
                    finalizeCharacter(2);
                }
            }, AUTO_FINALIZE_DELAY);
        }

        function clearAutoFinalizeTimer() {
            if (autoFinalizeTimer) {
                clearTimeout(autoFinalizeTimer);
                autoFinalizeTimer = null;
            }
        }

        function startDraw(canvas, ctx, e) {
            isDrawing = true;
            currentCanvas = canvas;
            currentCtx = ctx;
            const pos = getPos(canvas, e);
            lastX = pos.x;
            lastY = pos.y;

            if (canvas === canvas1) hasDrawing1 = true;
            else hasDrawing2 = true;

            if (canvas === canvas1 && hasDrawing2) {
                finalizeCharacter(2);
            } else if (canvas === canvas2 && hasDrawing1) {
                finalizeCharacter(1);
            }

            startAutoFinalizeTimer(canvas === canvas1 ? 1 : 2);
            updateActiveState();
        }

        function doDraw(e) {
            if (!isDrawing || !currentCanvas || !currentCtx) return;
            const pos = getPos(currentCanvas, e);

            currentCtx.beginPath();
            currentCtx.moveTo(lastX, lastY);
            currentCtx.lineTo(pos.x, pos.y);
            currentCtx.stroke();

            lastX = pos.x;
            lastY = pos.y;

            if (currentCanvas === canvas1 && hasDrawing1) {
                startAutoFinalizeTimer(1);
            } else if (currentCanvas === canvas2 && hasDrawing2) {
                startAutoFinalizeTimer(2);
            }
        }

        function endDraw() {
            isDrawing = false;
            currentCanvas = null;
            currentCtx = null;
        }

        function finalizeCharacter(canvasNum) {
            clearAutoFinalizeTimer();

            const sourceCanvas = canvasNum === 1 ? canvas1 : canvas2;
            const sourceCtx = canvasNum === 1 ? ctx1 : ctx2;

            const trimmed = trimCanvas(sourceCanvas);
            if (!trimmed) {
                if (canvasNum === 1) hasDrawing1 = false;
                else hasDrawing2 = false;
                updateActiveState();
                return;
            }

            const srcSize = sourceCanvas.width; 
            const charRes = CHAR_RESOLUTION;  
            const displayH = 32;              

            const srcPixels = sourceCtx.getImageData(0, 0, srcSize, srcSize);
            const sd = srcPixels.data;
            const ALPHA_THRESHOLD = 32;
            let srcMinX = srcSize, srcMaxX = 0;
            for (let y = 0; y < srcSize; y++) {
                for (let x = 0; x < srcSize; x++) {
                    const alpha = sd[(y * srcSize + x) * 4 + 3];
                    if (alpha > ALPHA_THRESHOLD) {
                        if (x < srcMinX) srcMinX = x;
                        if (x > srcMaxX) srcMaxX = x;
                    }
                }
            }

            if (srcMaxX === 0) {
                if (canvasNum === 1) hasDrawing1 = false;
                else hasDrawing2 = false;
                updateActiveState();
                return;
            }

            let finalCanvas;
            let finalImgW; 
            let displayW;  

            if (!MONO_WIDTH) {
                const scale = charRes / srcSize;
                const displayScale = displayH / srcSize; 
                const srcMargin = Math.round(PROP_MARGIN / displayScale);

                const cropSrcX = Math.max(0, srcMinX - srcMargin);
                const cropSrcW = Math.min(srcSize - cropSrcX, srcMaxX - srcMinX + 1 + srcMargin * 2);
                const cropSrcH = srcSize;

                finalImgW = Math.max(1, Math.round(cropSrcW * scale));
                displayW  = Math.max(1, Math.round(cropSrcW * displayScale + PROP_MARGIN * 2));

                finalCanvas = document.createElement('canvas');
                finalCanvas.width = finalImgW;
                finalCanvas.height = charRes;
                const finalCtx = finalCanvas.getContext('2d');
                finalCtx.clearRect(0, 0, finalImgW, charRes);
                finalCtx.drawImage(
                    sourceCanvas,
                    cropSrcX, 0, cropSrcW, cropSrcH,
                    0, 0, finalImgW, charRes
                );
            } else {
                finalCanvas = document.createElement('canvas');
                finalCanvas.width = charRes;
                finalCanvas.height = charRes;
                const finalCtx = finalCanvas.getContext('2d');
                finalCtx.clearRect(0, 0, charRes, charRes);
                finalCtx.drawImage(sourceCanvas, 0, 0, srcSize, srcSize, 0, 0, charRes, charRes);
                finalImgW = charRes;
                displayW  = displayH;
            }

            const imgData = finalCanvas.toDataURL('image/png');

            replaceSelectionWithCursor();

            const charDiv = document.createElement('span');
            charDiv.className = 'char-item';
            charDiv.style.width = displayW + 'px';
            charDiv.style.height = displayH + 'px';

            const img = document.createElement('img');
            img.src = imgData;
            img.alt = '手書き文字';
            charDiv.appendChild(img);

            currentLine.insertBefore(charDiv, cursor);

            sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);

            if (canvasNum === 1) hasDrawing1 = false;
            else hasDrawing2 = false;

            displayArea.scrollTop = displayArea.scrollHeight;
            updateActiveState();
        }

        function finalizeAll() {
            if (hasDrawing1) finalizeCharacter(1);
            if (hasDrawing2) finalizeCharacter(2);
        }

        function trimCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = pixels.data;

            let minX = canvas.width, minY = canvas.height;
            let maxX = 0, maxY = 0;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const alpha = data[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 0) {
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }

            if (maxX === 0) return null;

            const margin = MONO_WIDTH ? 0 : PROP_MARGIN;

            return {
                x: Math.max(0, minX - margin),
                y: Math.max(0, minY - margin),
                w: Math.min(canvas.width - minX + margin * 2, maxX - minX + margin * 2),
                h: Math.min(canvas.height - minY + margin * 2, maxY - minY + margin * 2)
            };
        }

        function updateActiveState() {
            if (hasDrawing1 && !hasDrawing2) {
                wrapper1.classList.add('active');
                wrapper1.classList.remove('inactive');
                wrapper2.classList.remove('active');
                wrapper2.classList.remove('inactive');
            } else if (!hasDrawing1 && hasDrawing2) {
                wrapper1.classList.remove('active');
                wrapper1.classList.remove('inactive');
                wrapper2.classList.add('active');
                wrapper2.classList.remove('inactive');
            } else if (hasDrawing1 && hasDrawing2) {
                wrapper1.classList.remove('active');
                wrapper2.classList.remove('active');
            } else {
                wrapper1.classList.add('active');
                wrapper1.classList.remove('inactive');
                wrapper2.classList.remove('active');
                wrapper2.classList.remove('inactive');
            }
        }

function moveCursorToNearestPosition(lineElement, tapX) {
//          【最優先追加】カーソルが移動したときは、理由を問わず画面上のすべての範囲選択を強制解除する
            document.querySelectorAll('.char-item.selected, .space-char.selected').forEach(el => el.classList.remove('selected'));
            
            const oldCursor = document.querySelector('.cursor');
            if (oldCursor) oldCursor.remove();

            const newCursor = document.createElement('span');
            newCursor.className = 'cursor';
            newCursor.id = 'cursor';

            const children = Array.from(lineElement.children).filter(child => !child.classList.contains('cursor'));

            // 改行のみ（文字要素がゼロ）の空の行をタップした場合は無条件で行頭に配置
            if (children.length === 0) {
                lineElement.appendChild(newCursor);
            } else {
                let closestIndex = 0;
                let minDistance = Infinity;

                for (let i = 0; i <= children.length; i++) {
                    let refX;
                    if (i === 0) {
                        refX = children[0].getBoundingClientRect().left;
                    } else if (i === children.length) {
                        refX = children[children.length - 1].getBoundingClientRect().right;
                    } else {
                        const leftRect = children[i - 1].getBoundingClientRect();
                        const rightRect = children[i].getBoundingClientRect();
                        refX = (leftRect.right + rightRect.left) / 2;
                    }

                    const distance = Math.abs(tapX - refX);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestIndex = i;
                    }
                }

                if (closestIndex === 0) {
                    lineElement.insertBefore(newCursor, children[0]);
                } else if (closestIndex >= children.length) {
                    lineElement.appendChild(newCursor);
                } else {
                    lineElement.insertBefore(newCursor, children[closestIndex]);
                }
            }

            currentLine.id = '';
            lineElement.id = 'currentLine';
            currentLine = lineElement;
            cursor = newCursor;

        // === ツールバー機能 ===
        function captureDisplayArea() {
            finalizeAll();

            const lines = document.querySelectorAll('.line');
            if (lines.length === 0) return null;

            const captureCanvas = document.createElement('canvas');
            const padding = 20;
            const lineHeight = 44;

            let maxWidth = 0;
            lines.forEach(line => {
                const chars = line.querySelectorAll('.char-item, .space-char');
                let width = padding * 2;
                chars.forEach(char => {
                    const rect = char.getBoundingClientRect();
                    width += rect.width + 4;
                });
                if (width > maxWidth) maxWidth = width;
            });

            captureCanvas.width = Math.max(maxWidth, 400);
            captureCanvas.height = lines.length * lineHeight + padding * 2;

            const cctx = captureCanvas.getContext('2d');
            cctx.fillStyle = '#ffffff';
            cctx.fillRect(0, 0, captureCanvas.width, captureCanvas.height);

            cctx.strokeStyle = '#eeeeee';
            cctx.lineWidth = 1;

            lines.forEach((line, lineIdx) => {
                const y = padding + lineIdx * lineHeight;
                cctx.beginPath();
                cctx.moveTo(0, y + lineHeight - 4);
                cctx.lineTo(captureCanvas.width, y + lineHeight - 4);
                cctx.stroke();

                let x = padding;
                const chars = line.querySelectorAll('.char-item, .space-char');
                chars.forEach((char) => {
                    if (char.classList.contains('space-char')) {
                        x += 16;
                    } else {
                        const img = char.querySelector('img');
                        if (img && img.complete) {
                            const w = parseInt(char.style.width) || 32;
                            cctx.drawImage(img, x, y, w, 32);
                            x += w + 4;
                        }
                    }
                });
            });

            return captureCanvas;
        }

        // === 境界線のドラッグ調整 ＆ 入力エリアの動的サイズ計算（長方形化対応） ===
        (function() {
            const displayArea = document.getElementById('displayArea');

            let displayHeight = window.innerHeight * 0.5;
            displayArea.style.flex = 'none';

            function startResize(e) {

                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            function doResize(e) {
                if (!isDragging) return;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const deltaY = clientY - startY;
                
                let newHeight = startHeight + deltaY;
                const minH = 100;

                newHeight = Math.max(minH, Math.min(maxH, newHeight));
                
                displayHeight = newHeight;
                displayArea.style.height = displayHeight + 'px';
                checkLayout(); 
            }

            function endResize() {
                isDragging = false;
            }

            displayArea.addEventListener('mousedown', startResize);
            window.addEventListener('mousemove', doResize);
            window.addEventListener('mouseup', endResize);

            displayArea.addEventListener('touchstart', startResize, { passive: true });
            window.addEventListener('touchmove', function(e) {
                if (isDragging) {
                    e.preventDefault(); 
                    doResize(e);
                }
            }, { passive: false });
            window.addEventListener('touchend', endResize);


            const PADDING = 10 * 2;   
            const GAP = 8;            
            const BTN_COL_W = 54;     
            const BTN_COLS = 2;       
            const CV_COUNT = 2;       
            
            const FIXED_W = BTN_COL_W * BTN_COLS + GAP * (BTN_COLS + CV_COUNT - 1) + PADDING;

            function checkLayout() {
                if (document.body.classList.contains('fullscreen')) {
                    displayArea.style.height = 'auto';
                    displayArea.style.flex = '1';
                } else {
                    displayArea.style.flex = 'none';
                    displayArea.style.height = displayHeight + 'px';
                }

                const totalW = inputArea.offsetWidth;
                const totalH = inputArea.clientHeight;

                const availableW = totalW - FIXED_W;
                let maxWForCanvas = Math.floor(availableW / CV_COUNT);
                if (maxWForCanvas < 40) maxWForCanvas = 40; 

                const maxHForCanvas = Math.max(40, totalH - PADDING);

                let finalW = Math.min(maxWForCanvas, maxHForCanvas);
                let finalH = finalW;

                const requiredBtnH = 48 * 2 + GAP;

                if (maxHForCanvas < requiredBtnH) {
                    finalH = maxHForCanvas;
                    finalW = maxWForCanvas;
                } else {
                    if (finalH === maxHForCanvas && finalW < maxWForCanvas) {
                        finalW = maxWForCanvas;
                    }
                }

                inputArea.style.setProperty('--cv-w', finalW + 'px');
                inputArea.style.setProperty('--cv-h', finalH + 'px');
            }

            checkLayout();
            const ro = new ResizeObserver(checkLayout);
            ro.observe(inputArea);
            window.addEventListener('resize', checkLayout);

            document.getElementById('btnFullscreen').addEventListener('click', () => setTimeout(checkLayout, 50));
            document.getElementById('btnExitFullscreen').addEventListener('click', () => setTimeout(checkLayout, 50));
        })();

        // === displayArea タッチ＆マウスドラッグ統合制御 ===
        (function() {
            const zoomContainer = document.getElementById('zoomContainer');
            let currentScale = 1.0;
            const MIN_SCALE = 0.5;
            const MAX_SCALE = 4.0;
            const LONG_PRESS_MS = 500; 

            let mode = 'idle'; 
            let mouseDragged = false; 

            let selectStartEl = null;
            let selectEndEl   = null;

            let touchStartX = 0, touchStartY = 0;
            let longPressTimer = null;

            // マウス用の長押し・移動判定変数
            let mouseLongPressTimer = null;
            let mouseStartX = 0, mouseStartY = 0;
            let isMouseSelectionReady = false; 

            let scrollStartX = 0, scrollStartY = 0;
            let scrollOriginLeft = 0, scrollOriginTop = 0;

            let pinchStartDist = 0;
            let pinchStartScale = 1.0;

            function getTouchDist(t) {
                const dx = t[0].clientX - t[1].clientX;
                const dy = t[0].clientY - t[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function charAtPoint(x, y) {
                const els = zoomContainer.querySelectorAll('.char-item, .space-char');
                for (const el of els) {
                    const r = el.getBoundingClientRect();
                    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return el;
                }
                return null;
            }

            function updateSelection(startEl, endEl) {
                document.querySelectorAll('.char-item.selected, .space-char.selected')
                    .forEach(el => el.classList.remove('selected'));
                if (!startEl || !endEl) return;
                const all = Array.from(zoomContainer.querySelectorAll('.char-item, .space-char'));
                const si = all.indexOf(startEl);
                const ei = all.indexOf(endEl);
                if (si < 0 || ei < 0) return;
                const lo = Math.min(si, ei), hi = Math.max(si, ei);
                for (let i = lo; i <= hi; i++) all[i].classList.add('selected');
                cursor.classList.add('hidden');
            }

            function clearSelection() {
                document.querySelectorAll('.char-item.selected, .space-char.selected')
                    .forEach(el => el.classList.remove('selected'));
                cursor.classList.remove('hidden');
            }

            function cancelLongPress() {
                if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            }

            function cancelMouseLongPress() {
                if (mouseLongPressTimer) { clearTimeout(mouseLongPressTimer); mouseLongPressTimer = null; }
            }

            function moveCursorToPoint(x, y) {
                const lines = Array.from(zoomContainer.querySelectorAll('.line'));
                let targetLine = null;
                
                for (const line of lines) {
                    const r = line.getBoundingClientRect();
                    if (y >= r.top && y <= r.bottom) {
                        targetLine = line;
                        break;
                    }
                }
                
                if (targetLine && targetLine.querySelectorAll('.char-item, .space-char').length === 0) {
                    moveCursorToNearestPosition(targetLine, x);
                    return;
                }

                const els = Array.from(zoomContainer.querySelectorAll('.char-item, .space-char'));
                if (els.length === 0) {
                    if (lines.length > 0) moveCursorToNearestPosition(lines[0], x);
                    return;
                }
                
                let nearest = null, nearestDist = Infinity;
                for (const el of els) {
                    const r = el.getBoundingClientRect();
                    const cx = (r.left + r.right) / 2;
                    const cy = (r.top + r.bottom) / 2;
                    const dist = Math.abs(cx - x) + Math.abs(cy - y) * 2;
                    if (dist < nearestDist) { nearestDist = dist; nearest = el; }
                }
                if (!nearest) return;
                const r = nearest.getBoundingClientRect();
                const cx = (r.left + r.right) / 2;
                if (x < cx) {
                    nearest.parentNode.insertBefore(cursor, nearest);
                } else {
                    nearest.parentNode.insertBefore(cursor, nearest.nextSibling);
                }
                currentLine = cursor.parentNode;
                
                lines.forEach(l => l.id = '');
                currentLine.id = 'currentLine';
            }

            function forceEndMouseSelection() {
                cancelMouseLongPress();
                if (mode === 'mouse_selecting' || isMouseSelectionReady || selectStartEl) {
                    mode = 'idle';
                    isMouseSelectionReady = false;
                    selectStartEl = null;
                    selectEndEl = null;
                    return true; 
                }
                return false;
            }

            displayArea.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;
                if (displayArea.offsetHeight - (e.clientY - displayArea.getBoundingClientRect().top) <= 15) return;

                const startEl = charAtPoint(e.clientX, e.clientY);
                if (startEl) {
                    mouseStartX = e.clientX;
                    mouseStartY = e.clientY;
                    mouseDragged = false;
                    isMouseSelectionReady = false; 
                    selectStartEl = startEl;
                    selectEndEl = startEl;

                    cancelMouseLongPress();
                    mouseLongPressTimer = setTimeout(function() {
                        isMouseSelectionReady = true;
                        mode = 'mouse_selecting';
                        clearSelection();
                        selectStartEl.classList.add('selected');
                        cursor.classList.add('hidden');
                    }, LONG_PRESS_MS);
                }
            });

            window.addEventListener('mousemove', function(e) {
                if (!selectStartEl) return;

                const dx = e.clientX - mouseStartX;
                const dy = e.clientY - mouseStartY;
                const moveDistance = Math.sqrt(dx * dx + dy * dy);

                if (!isMouseSelectionReady && moveDistance > 8) {
                    cancelMouseLongPress();
                    isMouseSelectionReady = true;
                    mode = 'mouse_selecting';
                    clearSelection();
                    selectStartEl.classList.add('selected');
                    cursor.classList.add('hidden');
                }

                if (mode === 'mouse_selecting') {
                    mouseDragged = true; 
                    const el = charAtPoint(e.clientX, e.clientY);
                    if (el && el !== selectEndEl) {
                        selectEndEl = el;
                        updateSelection(selectStartEl, selectEndEl);
                    }
                    e.preventDefault();
                }
            }, { passive: false });

            window.addEventListener('mouseup', function(e) {
                if (e.button !== 0) return;
                
                const wasSelecting = forceEndMouseSelection();
                
                if (wasSelecting && mouseDragged) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }

                if (!mouseDragged && !wasSelecting && mouseStartX !== 0) {
                    if (charAtPoint(mouseStartX, mouseStartY) || e.target.closest('.line')) {
                        clearSelection();
                        moveCursorToPoint(mouseStartX, mouseStartY);
                    }
                }

                mouseStartX = 0;
                mouseStartY = 0;
                mouseDragged = false;
            }, true); 

            displayArea.addEventListener('dragstart', function(e) {
                if (selectStartEl) {
                    e.preventDefault();
                }
            });

            window.addEventListener('blur', function() {
                forceEndMouseSelection();
                mouseDragged = false;
            });
            document.addEventListener('mouseleave', function() {
                forceEndMouseSelection();
                mouseDragged = false;
            });

            displayArea.addEventListener('click', function(e) {
                if (mouseDragged) {
                    mouseDragged = false; 
                    e.stopPropagation();
                    e.preventDefault();
                    return;
                }

                const selected = document.querySelectorAll('.char-item.selected, .space-char.selected');
                if (selected.length > 0 && !e.target.closest('.char-item, .space-char')) {
                    clearSelection();
                    mode = 'idle';
                }
            }, true); 

            displayArea.addEventListener('touchstart', function(e) {
                if (e.target === displayArea && displayArea.offsetHeight - (e.touches[0].clientY - displayArea.getBoundingClientRect().top) <= 15) {
                    return;
                }

                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    
                    scrollStartX = t.clientX;
                    scrollStartY = t.clientY;
                    scrollOriginLeft = displayArea.scrollLeft;
                    scrollOriginTop  = displayArea.scrollTop;

                    mode = 'longpress_pending';
                    cancelLongPress();
                    
                    longPressTimer = setTimeout(function() {
                        mode = 'selecting';
                        selectStartEl = charAtPoint(touchStartX, touchStartY);
                        selectEndEl = selectStartEl;
                        clearSelection();
                        if (selectStartEl) selectStartEl.classList.add('selected');
                        cursor.classList.add('hidden');
                    }, LONG_PRESS_MS);

                } else if (e.touches.length === 2) {
                    cancelLongPress();
                    mode = 'pinching';
                    const dist = getTouchDist(e.touches);
                    pinchStartDist  = dist;
                    pinchStartScale = currentScale;
                    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    scrollStartX = mx;
                    scrollStartY = my;
                    scrollOriginLeft = displayArea.scrollLeft;
                    scrollOriginTop  = displayArea.scrollTop;
                    clearSelection();
                }
                if (mode !== 'idle' && mode !== 'mouse_selecting') e.preventDefault();
            }, { passive: false });

            displayArea.addEventListener('touchmove', function(e) {
                if (mode === 'idle' || mode === 'mouse_selecting') return;
                e.preventDefault();

                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    const dx = t.clientX - touchStartX;
                    const dy = t.clientY - touchStartY;
                    const moved = Math.sqrt(dx*dx + dy*dy);

                    if (mode === 'longpress_pending') {
                        if (moved > 8) { 
                            cancelLongPress(); 
                            mode = 'scrolling_1finger'; 
                        }
                    }

                    if (mode === 'scrolling_1finger') {
                        const scrollDX = t.clientX - scrollStartX;
                        const scrollDY = t.clientY - scrollStartY;
                        displayArea.scrollLeft = scrollOriginLeft - scrollDX;
                        displayArea.scrollTop  = scrollOriginTop - scrollDY;
                    } else if (mode === 'selecting') {
                        const el = charAtPoint(t.clientX, t.clientY);
                        if (el && el !== selectEndEl) {
                            selectEndEl = el;
                            updateSelection(selectStartEl, selectEndEl);
                        }
                    }
                } else if (e.touches.length === 2) {
                    const dist = getTouchDist(e.touches);
                    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const pinchRatio = dist / pinchStartDist;
                    const scrollDX   = mx - scrollStartX;
                    const scrollDY   = my - scrollStartY;

                    let newScale = pinchStartScale * pinchRatio;
                    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
                    currentScale = newScale;
                    zoomContainer.style.transform = 'scale(' + currentScale + ')';

                    displayArea.scrollLeft = scrollOriginLeft - scrollDX;
                    displayArea.scrollTop  = scrollOriginTop  - scrollDY;
                }
            }, { passive: false });

            displayArea.addEventListener('touchend', function(e) {
                if (e.touches.length === 0) {
                    if (mode === 'longpress_pending') {
                        cancelLongPress();
                        moveCursorToPoint(touchStartX, touchStartY);
                        clearSelection();
                        cursor.classList.remove('hidden');
                    }
                    if (mode !== 'selecting') mode = 'idle';
                }
            }, { passive: true });
        })();

        // === 画面右下ボタン ＆ キーボードショートカット完全統合制御 ===
        document.getElementById('btnCopy').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            finalizeAll();
            copySelectedToClipboard();
        });

        document.getElementById('btnCut').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            finalizeAll();
            if (!copySelectedToClipboard()) return;
            getSelectedElements().forEach(el => el.remove());
        });

        document.getElementById('btnPaste').addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            finalizeAll();
            if (internalClipboard.length === 0) return;
            replaceSelectionWithCursor(); 
            pasteFromClipboard();
        });

        window.addEventListener('keydown', function(e) {
            const isCtrl = e.ctrlKey || e.metaKey;
            if (!isCtrl) return;

            const key = e.key.toLowerCase();

            if (key === 'c') {
                e.preventDefault();
                finalizeAll();
                copySelectedToClipboard();
            } else if (key === 'x') {
                e.preventDefault();
                finalizeAll();
                if (copySelectedToClipboard()) {
                    getSelectedElements().forEach(el => el.remove());
                }
            } else if (key === 'v') {
                e.preventDefault();
                finalizeAll();
                if (internalClipboard.length > 0) {
                    replaceSelectionWithCursor();
                    pasteFromClipboard();
                }
            }
        });
        // === ここまで追加：キーボードイベント制御（コピペ対応版） ===
    </script>
</body>
</html>
